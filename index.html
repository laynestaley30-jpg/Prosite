<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
    --theme:#8b5cf6;
    --theme-light:#a78bfa;
    --text:#fff;
    --muted:rgba(255,255,255,.62);
    --sidebar-alpha:.58;
    --blur:18px;
    --hover-scale:1.10;
    --sidebar-width:78px;
    --main-padding:45px;
    --card-gap:15px;
}

* {
    box-sizing:border-box;
}

html,body {
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body {
    font-family:"Space Grotesk",sans-serif;
    color:var(--text);
    background:#090912;
}

.background {
    position:fixed;
    inset:0;
    z-index:-10;
    overflow:hidden;
    background:
        radial-gradient(circle at 20% 20%,rgba(139,92,246,.35),transparent 35%),
        radial-gradient(circle at 80% 80%,rgba(76,29,149,.28),transparent 35%),
        #090912;
}

.background::before,
.background::after {
    content:"";
    position:absolute;
    width:55vw;
    height:55vw;
    border-radius:50%;
    filter:blur(80px);
    opacity:.18;
    animation:novaFloat 14s ease-in-out infinite alternate;
}

.background::before {
    background:var(--theme);
    top:-25vw;
    left:-20vw;
}

.background::after {
    background:var(--theme-light);
    right:-25vw;
    bottom:-25vw;
    animation-delay:-5s;
}

@keyframes novaFloat {
    from {
        transform:translate(0,0) scale(1);
    }
    to {
        transform:translate(7vw,5vw) scale(1.15);
    }
}

.app {
    width:100%;
    height:100%;
    display:flex;
}

.sidebar {
    width:var(--sidebar-width);
    height:calc(100% - 28px);
    margin:14px;
    padding:10px 9px;
    display:flex;
    flex-direction:column;
    align-items:center;
    background:rgba(10,10,20,var(--sidebar-alpha));
    backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));
    border:1px solid rgba(255,255,255,.09);
    border-radius:23px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
    transition:.35s ease;
}

.sidebar-time {
    width:100%;
    text-align:center;
    font-size:11px;
    font-weight:600;
    color:var(--muted);
    margin:5px 0 14px;
}

.sidebar-buttons {
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
}

.sidebar-bottom {
    margin-top:auto;
}

.sidebar-button {
    position:relative;
    width:50px;
    height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:0;
    border-radius:16px;
    background:rgba(255,255,255,.07);
    color:#fff;
    text-decoration:none;
    cursor:pointer;
    transition:transform .28s ease,background .25s ease;
}

.sidebar-button:hover {
    transform:scale(var(--hover-scale));
    background:rgba(255,255,255,.14);
    z-index:5;
}

.sidebar-button::after {
    content:attr(data-label);
    position:absolute;
    left:64px;
    top:50%;
    transform:translateY(-50%) translateX(-5px);
    padding:7px 10px;
    background:rgba(8,8,15,.94);
    border:1px solid rgba(255,255,255,.1);
    border-radius:9px;
    color:white;
    font-size:12px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:.2s ease .45s;
}

.sidebar-button:hover::after {
    opacity:1;
    transform:translateY(-50%) translateX(0);
}

.home-button svg,
.settings-button svg {
    width:27px;
    height:27px;
    fill:var(--theme);
    display:block;
}

.settings-button svg {
    transition:transform .35s ease;
}

.settings-button:hover svg {
    transform:rotate(35deg);
}

.logo-button {
    overflow:hidden;
}

.logo-button img {
    width:29px;
    height:29px;
    object-fit:contain;
    display:block;
}

.games-button {
    background:#fff;
}

.games-button:hover {
    background:#fff;
}

.games-button img {
    width:31px;
    height:31px;
}

.main {
    flex:1;
    height:100%;
    padding:35px var(--main-padding);
    overflow-y:auto;
}

.home {
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.welcome {
    margin-top:20px;
    text-align:center;
}

.welcome h1 {
    margin:0;
    font-size:clamp(38px,6vw,70px);
    font-weight:600;
    letter-spacing:-3px;
}

.welcome h1 span {
    color:var(--theme-light);
}

.welcome p {
    margin:8px 0 0;
    color:var(--muted);
    font-size:14px;
}

    margin-top:10px;
    text-align:center;211
