<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova</title>

<style>
:root{
--purple:#8b5cf6;
--purple2:#a78bfa;
--bg:#07070d;
--panel:rgba(20,20,32,.75);
--text:#fff;
--muted:rgba(255,255,255,.6);
}

*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
}

body{
font-family:Arial,sans-serif;
color:var(--text);
background:
radial-gradient(circle at 15% 20%,rgba(139,92,246,.28),transparent 35%),
radial-gradient(circle at 85% 80%,rgba(76,29,149,.25),transparent 35%),
var(--bg);
}

.app{
display:flex;
width:100%;
height:100%;
}

.sidebar{
width:78px;
margin:14px;
padding:12px 8px;
height:calc(100% - 28px);
display:flex;
flex-direction:column;
align-items:center;
background:rgba(12,12,22,.85);
border:1px solid rgba(255,255,255,.1);
border-radius:23px;
backdrop-filter:blur(20px);
}

.sidebar-buttons{
display:flex;
flex-direction:column;
gap:10px;
align-items:center;
}

.sidebar-bottom{
margin-top:auto;
}

.sidebar-button{
width:50px;
height:50px;
border:0;
border-radius:16px;
background:rgba(255,255,255,.07);
color:white;
font-size:21px;
cursor:pointer;
transition:.2s;
}

.sidebar-button:hover{
transform:scale(1.08);
background:rgba(139,92,246,.3);
}

.main{
flex:1;
overflow-y:auto;
padding:40px;
}

.hero{
max-width:1000px;
margin:auto;
}

.logo{
font-size:14px;
color:var(--purple2);
font-weight:bold;
letter-spacing:2px;
}

h1{
font-size:clamp(45px,7vw,80px);
letter-spacing:-4px;
margin:15px 0 10px;
}

h1 span{
color:var(--purple2);
}

.subtitle{
color:var(--muted);
}

.clock{
margin-top:25px;
font-size:22px;
}

.cards{
margin-top:40px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
gap:15px;
}

.card{
padding:25px;
min-height:130px;
border-radius:20px;
background:var(--panel);
border:1px solid rgba(255,255,255,.08);
cursor:pointer;
transition:.2s;
backdrop-filter:blur(15px);
}

.card:hover{
transform:translateY(-5px);
border-color:rgba(167,139,250,.4);
}

.card-icon{
font-size:30px;
margin-bottom:18px;
}

.card h2{
margin:0 0 7px;
font-size:17px;
}

.card p{
margin:0;
font-size:12px;
color:var(--muted);
}

@media(max-width:600px){
.sidebar{
width:62px;
margin:9px;
height:calc(100% - 18px);
}
.sidebar-button{
width:44px;
height:44px;
}
.main{
padding:25px 18px;
}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="sidebar-buttons">

<button class="sidebar-button" onclick="location.href='index.html'">🏠</button>

<button class="sidebar-button" onclick="location.href='games.html'">🎮</button>

<button class="sidebar-button" onclick="location.href='music.html'">🎵</button>

<button class="sidebar-button" onclick="location.href='chat.html'">💬</button>

<button class="sidebar-button" onclick="location.href='Nova.html'">🤖</button>

<button class="sidebar-button" onclick="window.open('https://www.google.com','_blank')">G</button>

</div>

<div class="sidebar-bottom">

<button class="sidebar-button" onclick="location.href='settings.html'">⚙️</button>

</div>

</aside>


<main class="main">

<section class="hero">

<div class="logo">NOVA</div>

<h1>
Welcome to <span>Nova.</span>
</h1>

<p class="subtitle">
Your games, music, chat and AI in one place.
</p>

<div class="clock" id="clock"></div>

<div class="cards">

<div class="card" onclick="location.href='games.html'">
<div class="card-icon">🎮</div>
<h2>Games</h2>
<p>Open your game hub.</p>
</div>

<div class="card" onclick="location.href='Nova.html'">
<div class="card-icon">🤖</div>
<h2>Nova AI</h2>
<p>Talk to your AI assistant.</p>
</div>

<div class="card" onclick="location.href='chat.html'">
<div class="card-icon">💬</div>
<h2>Chat</h2>
<p>Open Nova Chat.</p>
</div>

<div class="card" onclick="location.href='music.html'">
<div class="card-icon">🎵</div>
<h2>Music</h2>
<p>Open your music area.</p>
</div>

<div class="card" onclick="window.open('https://www.google.com','_blank')">
<div class="card-icon">G</div>
<h2>Google</h2>
<p>Search the web.</p>
</div>

<div class="card" onclick="location.href='settings.html'">
<div class="card-icon">⚙️</div>
<h2>Settings</h2>
<p>Configure Nova.</p>
</div>

</div>

</section>

</main>

</div>

<script>
function updateClock(){
document.getElementById("clock").textContent =
new Date().toLocaleString([],{
weekday:"long",
month:"long",
day:"numeric",
hour:"numeric",
minute:"2-digit",
second:"2-digit"
});
}

updateClock();
setInterval(updateClock,1000);
</script>

</body>
</html>
