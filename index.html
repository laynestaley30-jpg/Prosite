<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Nova</title>

<style>

/* =========================
   NOVA THEME
========================= */

:root {
    --purple: #8b5cf6;
    --purple-light: #a78bfa;
    --background: #080810;
    --panel: rgba(18,18,30,.78);
    --text: #ffffff;
    --muted: rgba(255,255,255,.6);
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;

    color: var(--text);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(139,92,246,.30),
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(76,29,149,.25),
            transparent 35%
        ),
        var(--background);
}


/* =========================
   APP
========================= */

.app {
    width: 100%;
    height: 100%;

    display: flex;
}


/* =========================
   SIDEBAR
========================= */

.sidebar {

    width: 78px;

    height:
        calc(100% - 28px);

    margin: 14px;

    padding: 12px 8px;

    display: flex;

    flex-direction: column;

    align-items: center;

    background:
        rgba(12,12,22,.82);

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius: 23px;

    backdrop-filter:
        blur(18px);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.25);
}


/* =========================
   SIDEBAR BUTTONS
========================= */

.sidebar-buttons {

    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 10px;
}


.sidebar-button {

    position: relative;

    width: 50px;
    height: 50px;

    border: 0;

    border-radius: 16px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        rgba(255,255,255,.07);

    color: white;

    font-size: 22px;

    cursor: pointer;

    transition:
        .2s ease;
}


.sidebar-button:hover {

    transform:
        scale(1.08);

    background:
        rgba(255,255,255,.14);
}


/* TOOLTIP */

.sidebar-button::after {

    content:
        attr(data-label);

    position: absolute;

    left: 62px;

    top: 50%;

    transform:
        translateY(-50%)
        translateX(-5px);

    padding:
        7px 10px;

    border-radius:
        9px;

    background:
        rgba(5,5,10,.96);

    color:
        white;

    font-size:
        12px;

    white-space:
        nowrap;

    opacity:
        0;

    pointer-events:
        none;

    transition:
        .2s ease;
}


.sidebar-button:hover::after {

    opacity:
        1;

    transform:
        translateY(-50%)
        translateX(0);
}


/* =========================
   NOVA AI BUTTON
========================= */

.ai-button {

    background:
        linear-gradient(
            135deg,
            rgba(139,92,246,.38),
            rgba(167,139,250,.20)
        );

    border:
        1px solid
        rgba(167,139,250,.35);

    box-shadow:
        0 0 18px
        rgba(139,92,246,.12);
}


.ai-button:hover {

    background:
        linear-gradient(
            135deg,
            rgba(139,92,246,.62),
            rgba(167,139,250,.38)
        );

    box-shadow:
        0 0 25px
        rgba(139,92,246,.3);
}


/* =========================
   SETTINGS AREA
========================= */

.sidebar-bottom {

    margin-top:
        auto;
}


/* =========================
   MAIN
========================= */

.main {

    flex: 1;

    height: 100%;

    overflow-y: auto;

    padding:
        35px 45px;
}


/* =========================
   HOME
========================= */

.home {

    min-height:
        100%;

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;
}


/* =========================
   WELCOME
========================= */

.welcome {

    margin-top:
        30px;

    text-align:
        center;
}


.welcome h1 {

    margin:
        0;

    font-size:
        clamp(45px,7vw,80px);

    letter-spacing:
        -4px;

    font-weight:
        700;
}


.welcome h1 span {

    color:
        var(--purple-light);
}


.welcome p {

    margin:
        10px 0 0;

    color:
        var(--muted);

    font-size:
        14px;
}


/* =========================
   CLOCK
========================= */

.clock {

    margin-top:
        18px;

    text-align:
        center;
}


.clock-time {

    font-size:
        clamp(32px,5vw,55px);

    font-weight:
        500;
}


.clock-date {

    margin-top:
        3px;

    color:
        var(--muted);

    font-size:
        12px;
}


/* =========================
   CARDS
========================= */

.cards {

    width:
        min(900px,100%);

    margin-top:
        45px;

    display:
        grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(180px,1fr)
        );

    gap:
        15px;
}


.card {

    padding:
        22px;

    border-radius:
        20px;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid
        rgba(255,255,255,.08);

    cursor:
        pointer;

    transition:
        .25s ease;
}


.card:hover {

    transform:
        translateY(-5px);

    background:
        rgba(255,255,255,.095);
}


.card h3 {

    margin:
        0 0 7px;

    font-size:
        16px;
}


.card p {

    margin:
        0;

    color:
        var(--muted);

    font-size:
        12px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    .sidebar {

        width:
            65px;

        margin:
            9px;

        height:
            calc(100% - 18px);
    }


    .sidebar-button {

        width:
            44px;

        height:
            44px;

        font-size:
            20px;
    }


    .sidebar-button::after {

        display:
            none;
    }


    .main {

        padding:
            25px 18px;
    }


    .cards {

        grid-template-columns:
            1fr;
    }

}

</style>

</head>


<body>


<div class="app">


<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar">


    <div class="sidebar-buttons">


        <!-- HOME -->

        <button
            class="sidebar-button"
            data-label="Home"
            onclick="goHome()">

            🏠

        </button>


        <!-- GAMES -->

        <button
            class="sidebar-button"
            data-label="Games"
            onclick="openGames()">

            🎮

        </button>


        <!-- MUSIC -->

        <button
            class="sidebar-button"
            data-label="Music"
            onclick="openMusic()">

            🎵

        </button>


        <!-- CHAT -->

        <button
            class="sidebar-button"
            data-label="Chat"
            onclick="openChat()">

            💬

        </button>


        <!-- =====================
             NOVA AI
        ====================== -->

        <button
            class="sidebar-button ai-button"
            data-label="Nova AI"
            onclick="openNovaAI()">

            🤖

        </button>


        <!-- BROWSER -->

        <button
            class="sidebar-button"
            data-label="Browser"
            onclick="openBrowser()">

            🌐

        </button>


    </div>


    <!-- SETTINGS -->

    <div class="sidebar-bottom">

        <button
            class="sidebar-button"
            data-label="Settings"
            onclick="openSettings()">

            ⚙️

        </button>

    </div>


</aside>


<!-- =========================
     MAIN CONTENT
========================= -->

<main class="main">


<section class="home">


    <div class="welcome">

        <h1>
            Welcome to
            <span>Nova</span>
        </h1>

        <p>
            Your personal space on the web.
        </p>

    </div>


    <!-- CLOCK -->

    <div class="clock">

        <div
            class="clock-time"
            id="clock">

            12:00

        </div>

        <div
            class="clock-date"
            id="date">

            Loading...

        </div>

    </div>


    <!-- QUICK LINKS -->

    <div class="cards">


        <div
            class="card"
            onclick="openGames()">

            <h3>
                🎮 Games
            </h3>

            <p>
                Open your game hub.
            </p>

        </div>


        <div
            class="card"
            onclick="openMusic()">

            <h3>
                🎵 Music
            </h3>

            <p>
                Open your music.
            </p>

        </div>


        <div
            class="card"
            onclick="openChat()">

            <h3>
                💬 Chat
            </h3>

            <p>
                Talk with other people.
            </p>

        </div>


        <div
            class="card"
            onclick="openNovaAI()">

            <h3>
                🤖 Nova AI
            </h3>

            <p>
                Open your AI assistant.
            </p>

        </div>


        <div
            class="card"
            onclick="openBrowser()">

            <h3>
                🌐 Browser
            </h3>

            <p>
                Browse the web.
            </p>

        </div>


    </div>


</section>


</main>


<script>


/* =========================
   CLOCK
========================= */

function updateClock() {

    const now =
        new Date();


    document.getElementById(
        "clock"
    ).textContent =
        now.toLocaleTimeString(
            [],
            {
                hour: "numeric",
                minute: "2-digit",
                second: "2-digit"
            }
        );


    document.getElementById(
        "date"
    ).textContent =
        now.toLocaleDateString(
            [],
            {
                weekday: "long",
                month: "long",
                day: "numeric",
                year: "numeric"
            }
        );

}


updateClock();


setInterval(
    updateClock,
    1000
);


/* =========================
   NOVA AI
========================= */

function openNovaAI() {

    window.location.href =
        "Nova.html";

}


/* =========================
   OTHER PAGES
========================= */

function goHome() {

    window.location.href =
        "index.html";

}


function openGames() {

    window.location.href =
        "games.html";

}


function openMusic() {

    window.location.href =
        "music.html";

}


function openChat() {

    window.location.href =
        "chat.html";

}


function openBrowser() {

    window.location.href =
        "browser.html";

}


function openSettings() {

    window.location.href =
        "settings.html";

}

</script>


</body>

</html>
