<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Games</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 20%, #202060 0%, transparent 30%),
        radial-gradient(circle at 80% 80%, #30104f 0%, transparent 30%),
        #070712;
    color: white;
    min-height: 100vh;
}

/* Stars */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(white 1px, transparent 1px);
    background-size: 80px 80px, 130px 130px;
    background-position: 0 0, 40px 60px;
    opacity: 0.25;
    pointer-events: none;
}

/* Header */

header {
    position: relative;
    z-index: 2;
    padding: 25px 7%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    background: rgba(5,5,15,0.75);
    backdrop-filter: blur(12px);
}

.logo {
    font-size: 27px;
    font-weight: bold;
    letter-spacing: 2px;
}

.logo span {
    color: #8b5cff;
}

nav a {
    color: #bbb;
    text-decoration: none;
    margin-left: 25px;
}

nav a:hover {
    color: white;
}

/* Hero */

.hero {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 80px 20px 50px;
}

.hero h1 {
    font-size: 55px;
    margin-bottom: 15px;
}

.hero h1 span {
    color: #8b5cff;
}

.hero p {
    color: #aaa;
    font-size: 18px;
    margin-bottom: 30px;
}

/* Search */

.search {
    width: min(600px, 90%);
    margin: auto;
}

.search input {
    width: 100%;
    padding: 17px 22px;
    border-radius: 30px;
    border: 1px solid #333;
    background: rgba(20,20,35,0.9);
    color: white;
    font-size: 16px;
    outline: none;
}

.search input:focus {
    border-color: #8b5cff;
}

/* Categories */

.categories {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 20px;
}

.category {
    background: #171725;
    border: 1px solid #29293c;
    color: #bbb;
    padding: 10px 18px;
    border-radius: 20px;
    cursor: pointer;
}

.category:hover {
    background: #8b5cff;
    color: white;
}

/* Games */

.games {
    position: relative;
    z-index: 1;
    width: 86%;
    margin: 30px auto 80px;
}

.games h2 {
    margin-bottom: 25px;
}

.game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 20px;
}

.game {
    background: rgba(20,20,32,0.9);
    border: 1px solid #29293b;
    border-radius: 15px;
    overflow: hidden;
    transition: 0.2s;
    cursor: pointer;
}

.game:hover {
    transform: translateY(-6px);
    border-color: #8b5cff;
    box-shadow: 0 10px 30px rgba(139,92,255,0.2);
}

.game-image {
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 45px;
    background: linear-gradient(135deg, #242447, #11111d);
}

.game-info {
    padding: 15px;
}

.game-info h3 {
    margin-bottom: 5px;
}

.game-info p {
    color: #888;
    font-size: 13px;
}

/* Game screen */

#gameScreen {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #050509;
    padding: 25px;
}

#gameScreen h2 {
    margin-bottom: 15px;
}

.close {
    background: #8b5cff;
    border: none;
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 20px;
}

.game-placeholder {
    height: 75vh;
    border: 1px solid #333;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
    background: #0b0b13;
}
</style>
</head>

<body>

<header>
    <div class="logo">NOVA<span>GAMES</span></div>

    <nav>
        <a href="#">Home</a>
        <a href="#games">Games</a>
    </nav>
</header>

<section class="hero">

    <h1>Welcome to <span>Nova</span></h1>

    <p>Your little corner of the gaming universe.</p>

    <div class="search">
        <input
            type="text"
            id="search"
            placeholder="Search games..."
            onkeyup="searchGames()"
        >
    </div>

</section>

<div class="categories">

    <button class="category" onclick="filterGames('all')">
        All
    </button>

    <button class="category" onclick="filterGames('action')">
        Action
    </button>

    <button class="category" onclick="filterGames('arcade')">
        Arcade
    </button>

    <button class="category" onclick="filterGames('puzzle')">
        Puzzle
    </button>

</div>

<section class="games" id="games">

    <h2>Featured Games</h2>

    <div class="game-grid">

        <div class="game" data-name="Space Runner" data-category="action"
             onclick="openGame('Space Runner')">

            <div class="game-image">🚀</div>

            <div class="game-info">
                <h3>Space Runner</h3>
                <p>Action</p>
            </div>

        </div>


        <div class="game" data-name="Pixel Quest" data-category="arcade"
             onclick="openGame('Pixel Quest')">

            <div class="game-image">👾</div>

            <div class="game-info">
                <h3>Pixel Quest</h3>
                <p>Arcade</p>
            </div>

        </div>


        <div class="game" data-name="Galaxy Blocks" data-category="puzzle"
             onclick="openGame('Galaxy Blocks')">

            <div class="game-image">🧩</div>

            <div class="game-info">
                <h3>Galaxy Blocks</h3>
                <p>Puzzle</p>
            </div>

        </div>


        <div class="game" data-name="Asteroid Attack" data-category="action"
             onclick="openGame('Asteroid Attack')">

            <div class="game-image">☄️</div>

            <div class="game-info">
                <h3>Asteroid Attack</h3>
                <p>Action</p>
            </div>

        </div>


        <div class="game" data-name="Neon Racer" data-category="arcade"
             onclick="openGame('Neon Racer')">

            <div class="game-image">🏎️</div>

            <div class="game-info">
                <h3>Neon Racer</h3>
                <p>Arcade</p>
            </div>

        </div>

    </div>

</section>


<div id="gameScreen">

    <button class="close" onclick="closeGame()">
        ← Back
    </button>

    <h2 id="gameTitle">Game</h2>

    <div class="game-placeholder">
        Your game will appear here.
    </div>

</div>


<script>

function openGame(name) {

    document.getElementById("gameScreen").style.display = "block";

    document.getElementById("gameTitle").textContent = name;

}

function closeGame() {

    document.getElementById("gameScreen").style.display = "none";

}

function searchGames() {

    let search =
        document.getElementById("search").value.toLowerCase();

    let games =
        document.querySelectorAll(".game");

    games.forEach(game => {

        let name =
            game.dataset.name.toLowerCase();

        if (name.includes(search)) {
            game.style.display = "block";
        } else {
            game.style.display = "none";
        }

    });

}

function filterGames(category) {

    let games =
        document.querySelectorAll(".game");

    games.forEach(game => {

        if (
            category === "all" ||
            game.dataset.category === category
        ) {
            game.style.display = "block";
        } else {
            game.style.display = "none";
        }

    });

}

</script>

</body>
</html>
