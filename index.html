<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lato:wght@400;700&family=Montserrat:wght@400;500;600&family=Orbitron:wght@400;500;600&family=Playfair+Display:wght@400;500;600&family=Poppins:wght@400;500;600&family=Roboto:wght@400;500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
    --theme: #8b5cf6;
    --theme2: #a855f7;
    --text: #ffffff;
    --muted: rgba(255,255,255,.65);
    --sidebar: rgba(15,15,28,.62);
    --box: rgba(255,255,255,.09);
    --radius: 16px;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    color: var(--text);
    font-family: "Space Grotesk", sans-serif;
    background: #090912;
}

#background {
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
        radial-gradient(circle at 15% 20%, rgba(139,92,246,.45), transparent 35%),
        radial-gradient(circle at 85% 80%, rgba(168,85,247,.28), transparent 35%),
        #090912;
    transition: background .5s ease;
}

#background.moving {
    animation: backgroundMove 12s ease-in-out infinite alternate;
}

@keyframes backgroundMove {
    0% {
        transform: scale(1);
        filter: hue-rotate(0deg);
    }
    100% {
        transform: scale(1.08);
        filter: hue-rotate(25deg);
    }
}

.app {
    width: 100%;
    height: 100%;
    display: flex;
}

.sidebar {
    width: 78px;
    height: calc(100% - 28px);
    margin: 14px;
    padding: 10px 9px;

    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;

    background: var(--sidebar);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border: 1px solid rgba(255,255,255,.08);
    border-radius: 22px;

    box-shadow: 0 12px 50px rgba(0,0,0,.25);
}

.side-time {
    width: 100%;
    text-align: center;
    font-size: 10px;
    color: var(--muted);
    padding: 5px 0 7px;
    white-space: nowrap;
}

.side-divider {
    width: 70%;
    height: 1px;
    background: rgba(255,255,255,.1);
    margin-bottom: 2px;
}

.side-button {
    position: relative;

    width: 52px;
    height: 52px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 0;
    border-radius: var(--radius);

    background: var(--box);
    color: white;

    text-decoration: none;
    cursor: pointer;

    transition:
        transform .25s ease,
        background .25s ease,
        box-shadow .25s ease;
}

.side-button:hover {
    transform: scale(1.10);
    background: rgba(255,255,255,.14);
    box-shadow: 0 8px 25px rgba(0,0,0,.18);
}

.side-button::after {
    content: attr(data-label);

    position: absolute;
    left: 66px;
    top: 50%;

    transform: translateY(-50%) translateX(-6px);

    opacity: 0;
    pointer-events: none;

    white-space: nowrap;

    padding: 7px 11px;
    border-radius: 9px;

    background: rgba(10,10,20,.9);
    border: 1px solid rgba(255,255,255,.1);

    color: white;
    font-size: 12px;

    transition:
        opacity .2s ease .45s,
        transform .2s ease .45s;

    z-index: 50;
}

.side-button:hover::after {
    opacity: 1;
    transform: translateY(-50%) translateX(0);
}

.side-button svg {
    width: 27px;
    height: 27px;
    display: block;
}

.home-button svg,
.settings-button svg {
    stroke: var(--theme);
}

.steam-button {
    background: #ffffff;
}

.steam-button:hover {
    background: #ffffff;
}

.steam-button svg {
    width: 28px;
    height: 28px;
}

.bottom-buttons {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.main {
    flex: 1;
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.home {
    text-align: center;
    transform: translateY(-18px);
}

.home-logo {
    width: 46px;
    height: 46px;
    margin: 0 auto 13px;

    border-radius: 15px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.1);

    color: var(--theme);

    box-shadow: 0 8px 35px rgba(0,0,0,.18);
}

.home-logo svg {
    width: 25px;
    height: 25px;
}

h1 {
    margin: 0;
    font-size: clamp(34px, 5vw, 58px);
    font-weight: 500;
    letter-spacing: -2px;
}

.subtitle {
    margin-top: 8px;
    color: var(--muted);
    font-size: 14px;
}

.clock {
    margin-top: 17px;
    font-size: clamp(32px, 4vw, 48px);
    font-weight: 500;
    letter-spacing: -1px;
}

.date {
    margin-top: 3px;
    color: var(--muted);
    font-size: 13px;
}

.settings-panel {
    position: fixed;
    top: 50%;
    left: 50%;

    width: min(570px, calc(100% - 35px));
    max-height: 82vh;

    transform: translate(-50%, -50%) scale(.96);

    padding: 25px;

    overflow-y: auto;

    background: rgba(12,12,24,.93);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    border: 1px solid rgba(255,255,255,.1);
    border-radius: 24px;

    box-shadow: 0 25px 90px rgba(0,0,0,.45);

    opacity: 0;
    pointer-events: none;

    transition:
        opacity .25s ease,
        transform .25s ease;

    z-index: 100;
}

.settings-panel.open {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
}

.settings-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}

.settings-header h2 {
    margin: 0;
    font-size: 25px;
    font-weight: 500;
}

.close-settings {
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 10px;
    background: var(--box);
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.setting {
    margin-bottom: 21px;
}

.setting label {
    display: block;
    margin-bottom: 9px;
    font-size: 13px;
    color: var(--muted);
}

select,
input[type="color"],
input[type="range"],
button {
    font-family: inherit;
}

select {
    width: 100%;
    padding: 11px 12px;
    border-radius: 11px;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.07);
    color: white;
    outline: none;
}

select option {
    background: #151525;
}

.color-row {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
}

.color-option {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.25);
    cursor: pointer;
}

.color-option:hover {
    transform: scale(1.08);
}

.range-row {
    display: flex;
    gap: 12px;
    align-items: center;
}

.range-row input {
    flex: 1;
}

.range-value {
    width: 45px;
    text-align: right;
    color: var(--muted);
    font-size: 12px;
}

.action-button {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 11px;
    background: var(--theme);
    color: white;
    cursor: pointer;
}

.action-button:hover {
    filter: brightness(1.12);
}

.secondary-button {
    margin-top: 8px;
    background: rgba(255,255,255,.08);
}

.panic-status {
    margin-top: 8px;
    color: var(--muted);
    font-size: 12px;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.25);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
    z-index: 90;
}

.overlay.open {
    opacity: 1;
    pointer-events: auto;
}

.panic-screen {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    z-index: 999;
}

.panic-screen.active {
    display: flex;
}

.panic-screen span {
    color: #111;
    font-family: Arial, sans-serif;
    font-size: 20px;
}

@media (max-width: 650px) {
    .sidebar {
        width: 67px;
        margin: 8px;
        height: calc(100% - 16px);
        padding: 8px 6px;
    }

    .side-button {
        width: 46px;
        height: 46px;
    }

    .side-button::after {
        display: none;
    }

    .home {
        transform: translateY(-10px);
    }
}
</style>
</head>

<body>

<div id="background"></div>

<div class="app">

    <aside class="sidebar">

        <div class="side-time" id="sideTime">12:00 PM</div>

        <div class="side-divider"></div>

        <!-- HOME -->
        <button class="side-button home-button"
                data-label="Home"
                onclick="showHome()"
                aria-label="Home">
            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 11.5 12 4l9 7.5"/>
                <path d="M5.5 10.5V20h13v-9.5"/>
                <path d="M9.5 20v-5.5h5V20"/>
            </svg>
        </button>

        <!-- GAMES -->
        <a class="side-button steam-button"
           data-label="Games"
           href="#"
           aria-label="Games">
            <svg viewBox="0 0 24 24">
                <path fill="#000000"
                    d="M12.5 2C6.7 2 2 6.2 2 11.7c0 4.7 3.5 8.6 8 9.3v-3.2c-1.2-.2-2.2-.8-2.9-1.6l-1.8 1.1c-.4.2-.9.1-1.1-.3-.3-.4-.1-.9.3-1.1l2-1.2c-.1-.4-.2-.8-.2-1.2 0-1.7 1.4-3.1 3.1-3.1.9 0 1.7.4 2.3 1l2.5-1.7c-.1-.3-.1-.6-.1-.9 0-1.8 1.5-3.3 3.3-3.3s3.3 1.5 3.3 3.3-1.5 3.3-3.3 3.3c-.5 0-1-.1-1.4-.3l-2.6 1.8c.1.3.1.6.1 1 0 1.8-1.5 3.3-3.3 3.3-.3 0-.6 0-.9-.1v3.2c.3 0 .7.1 1 .1 5.8 0 10.5-4.7 10.5-10.5S18.3 2 12.5 2z"/>
            </svg>
        </a>

        <!-- SPOTIFY -->
        <a class="side-button"
           data-label="Spotify"
           href="https://open.spotify.com/"
           target="_blank"
           rel="noopener"
           aria-label="Spotify">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" fill="#1DB954"/>
                <path d="M7 10.1c3.2-1 6.8-.8 9.8.4"
                      fill="none" stroke="white"
                      stroke-width="1.4" stroke-linecap="round"/>
                <path d="M7.7 13c2.7-.7 5.7-.5 8.1.4"
                      fill="none" stroke="white"
                      stroke-width="1.4" stroke-linecap="round"/>
                <path d="M8.5 15.7c2-.5 4.2-.3 6 .3"
                      fill="none" stroke="white"
                      stroke-width="1.4" stroke-linecap="round"/>
            </svg>
        </a>

        <!-- DISCORD -->
        <a class="side-button"
           data-label="Discord"
           href="https://discord.com/"
           target="_blank"
           rel="noopener"
           aria-label="Discord">
            <svg viewBox="0 0 24 24">
                <path fill="#5865F2"
                    d="M19.5 5.2A16.4 16.4 0 0 0 15.7 4l-.5 1a14.5 14.5 0 0 0-6.4 0l-.5-1a16.4 16.4 0 0 0-3.8 1.2C2.1 9.1 1.4 12.9 1.7 16.6a16.2 16.2 0 0 0 4.7 2.4l1.1-1.5c-.6-.2-1.1-.5-1.6-.8l.4-.3c3.1 1.5 6.8 1.5 9.9 0l.4.3c-.5.3-1 .6-1.6.8l1.1 1.5a16.2 16.2 0 0 0 4.7-2.4c.4-4.3-.7-8.1-1.8-11.4z"/>
                <circle cx="8.5" cy="12" r="1.2" fill="white"/>
                <circle cx="15.5" cy="12" r="1.2" fill="white"/>
            </svg>
        </a>

        <!-- BROWSER -->
        <a class="side-button"
           data-label="Browser"
           href="Browser.html"
           aria-label="Browser">
            <svg viewBox="0 0 24 24">
                <path fill="#4285F4"
                    d="M21.3 12.2c0-.7-.1-1.4-.2-2.1H12v4h5.2c-.2 1.3-.9 2.4-2 3.1v2.6h3.3c1.9-1.8 2.8-4.4 2.8-7.6z"/>
                <path fill="#34A853"
                    d="M12 21.8c2.7 0 4.9-.9 6.5-2.4l-3.3-2.6c-.9.6-2 .9-3.2.9-2.5 0-4.6-1.7-5.4-4H3.2v2.7c1.7 3.2 5 5.4 8.8 5.4z"/>
                <path fill="#FBBC05"
                    d="M6.6 13.7a5.8 5.8 0 0 1 0-3.4V7.6H3.2a9.8 9.8 0 0 0 0 8.8l3.4-2.7z"/>
                <path fill="#EA4335"
                    d="M12 6.2c1.5 0 2.8.5 3.8 1.5l2.8-2.8C16.9 3.4 14.7 2.2 12 2.2c-3.8 0-7.1 2.2-8.8 5.4l3.4 2.7c.8-2.4 2.9-4.1 5.4-4.1z"/>
            </svg>
        </a>

        <div class="bottom-buttons">

            <!-- SETTINGS -->
            <button class="side-button settings-button"
                    data-label="Settings"
                    onclick="toggleSettings()"
                    aria-label="Settings">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor"
                     stroke-width="1.8"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6z"/>
                    <path d="m19.4 15 .1.1a1.8 1.8 0 0 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .9v.2a1.8 1.8 0 0 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.9l-.1.1a1.8 1.8 0 0 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.9-3H3.7a1.8 1.8 0 0 1 0-3.6h.2a1.8 1.8 0 0 0 .9-3l-.1-.1a1.8 1.8 0 0 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.9v-.2a1.8 1.8 0 0 1 3.6 0v.2a1.8 1.8 0 0 0 3 .9l.1-.1a1.8 1.8 0 0 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .9 3h.2a1.8 1.8 0 0 1 0 3.6h-.2a1.8 1.8 0 0 0-.9 3z"/>
                </svg>
            </button>

        </div>

    </aside>

    <main class="main">

        <section class="home" id="home">

            <div class="home-logo">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor"
                     stroke-width="1.8"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <path d="M3 11.5 12 4l9 7.5"/>
                    <path d="M5.5 10.5V20h13v-9.5"/>
                    <path d="M9.5 20v-5.5h5V20"/>
                </svg>
            </div>

            <h1>Welcome to Nova</h1>

            <div class="subtitle">
                Your personal space.
            </div>

            <div class="clock" id="clock">
                12:00:00 PM
            </div>

            <div class="date" id="date">
                Thursday, August 13, 2026
            </div>

        </section>

    </main>

</div>

<div class="overlay" id="overlay" onclick="toggleSettings()"></div>

<div class="settings-panel" id="settings">

    <div class="settings-header">
        <h2>Nova Settings</h2>

        <button class="close-settings"
                onclick="toggleSettings()">
            ×
        </button>
    </div>

    <div class="setting">
        <label>Font</label>

        <select id="fontSelect" onchange="changeFont(this.value)">
            <option value="Space Grotesk">Space Grotesk</option>
            <option value="Inter">Inter</option>
            <option value="Poppins">Poppins</option>
            <option value="Montserrat">Montserrat</option>
            <option value="Roboto">Roboto</option>
            <option value="Lato">Lato</option>
            <option value="Orbitron">Orbitron</option>
            <option value="Playfair Display">Playfair Display</option>
        </select>
    </div>

    <div class="setting">
        <label>Theme color</label>

        <div class="color-row">
            <button class="color-option" style="background:#8b5cf6"
                    onclick="setTheme('#8b5cf6','#a855f7')"></button>

            <button class="color-option" style="background:#3b82f6"
                    onclick="setTheme('#3b82f6','#06b6d4')"></button>

            <button class="color-option" style="background:#22c55e"
                    onclick="setTheme('#22c55e','#10b981')"></button>

            <button class="color-option" style="background:#ef4444"
                    onclick="setTheme('#ef4444','#f97316')"></button>

            <button class="color-option" style="background:#f97316"
                    onclick="setTheme('#f97316','#facc15')"></button>

            <button class="color-option" style="background:#ec4899"
                    onclick="setTheme('#ec4899','#f43f5e')"></button>

            <button class="color-option" style="background:#06b6d4"
                    onclick="setTheme('#06b6d4','#3b82f6')"></button>
        </div>
    </div>

    <div class="setting">
        <label>Custom theme color</label>

        <input type="color"
               id="customColor"
               value="#8b5cf6"
               onchange="customTheme(this.value)">
    </div>

    <div class="setting">
        <label>Background</label>

        <select id="backgroundSelect"
                onchange="changeBackground(this.value)">
            <option value="purple">Purple</option>
            <option value="blue">Blue</option>
            <option value="green">Green</option>
            <option value="red">Red</option>
            <option value="sunset">Sunset</option>
            <option value="dark">Dark</option>
            <option value="moving">Moving Purple</option>
        </select>
    </div>

    <div class="setting">
        <label>Sidebar transparency</label>

        <div class="range-row">
            <input type="range"
                   min="20"
                   max="95"
                   value="62"
                   oninput="changeSidebar(this.value)">

            <span class="range-value" id="sidebarValue">
                62%
            </span>
        </div>
    </div>

    <div class="setting">
        <label>Clock format</label>

        <select id="clockFormat"
                onchange="saveSettings(); updateClock()">
            <option value="12">12 hour</option>
            <option value="24">24 hour</option>
        </select>
    </div>

    <div class="setting">
        <label>Clock seconds</label>

        <select id="secondsSelect"
                onchange="saveSettings(); updateClock()">
            <option value="yes">Show seconds</option>
            <option value="no">Hide seconds</option>
        </select>
    </div>

    <div class="setting">

        <label>Panic key</label>

        <button class="action-button"
                onclick="setPanicKey()">
            Set Panic Key
        </button>

        <button class="action-button secondary-button"
                onclick="clearPanicKey()">
            Clear Panic Key
        </button>

        <div class="panic-status"
             id="panicStatus">
            No panic key set.
        </div>

    </div>

    <div class="setting">

        <button class="action-button secondary-button"
                onclick="resetSettings()">
            Reset Nova Settings
        </button>

    </div>

</div>

<div class="panic-screen" id="panicScreen">
    <span>Nova</span>
</div>

<script>
let panicKey = localStorage.getItem("novaPanicKey");

function updateClock() {
    const now = new Date();

    const format =
        document.getElementById("clockFormat")?.value || "12";

    const showSeconds =
        document.getElementById("secondsSelect")?.value !== "no";

    let time;

    if (format === "24") {
        time = now.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
            second: showSeconds ? "2-digit" : undefined,
            hour12: false
        });
    } else {
        time = now.toLocaleTimeString([], {
            hour: "numeric",
            minute: "2-digit",
            second: showSeconds ? "2-digit" : undefined,
            hour12: true
        });
    }

    document.getElementById("clock").textContent = time;

    document.getElementById("sideTime").textContent =
        now.toLocaleTimeString([], {
            hour: "numeric",
            minute: "2-digit",
            hour12: true
        });

    document.getElementById("date").textContent =
        now.toLocaleDateString([], {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric"
        });
}

setInterval(updateClock, 1000);
updateClock();

function showHome() {
    document.getElementById("home").style.display = "block";
}

function toggleSettings() {
    document.getElementById("settings").classList.toggle("open");
    document.getElementById("overlay").classList.toggle("open");
}

function setTheme(primary, secondary) {
    document.documentElement.style.setProperty("--theme", primary);
    document.documentElement.style.setProperty("--theme2", secondary);

    localStorage.setItem("novaTheme", primary);
    localStorage.setItem("novaTheme2", secondary);
}

function customTheme(color) {
    setTheme(color, color);
}

function changeFont(font) {
    document.body.style.fontFamily =
        `"${font}", sans-serif`;

    localStorage.setItem("novaFont", font);
}

function changeBackground(type) {
    const bg = document.getElementById("background");

    bg.classList.remove("moving");

    const backgrounds = {
        purple:
            "radial-gradient(circle at 15% 20%, rgba(139,92,246,.45), transparent 35%), radial-gradient(circle at 85% 80%, rgba(168,85,247,.28), transparent 35%), #090912",

        blue:
            "radial-gradient(circle at 15% 20%, rgba(59,130,246,.45), transparent 35%), radial-gradient(circle at 85% 80%, rgba(6,182,212,.28), transparent 35%), #080d18",

        green:
            "radial-gradient(circle at 15% 20%, rgba(34,197,94,.4), transparent 35%), radial-gradient(circle at 85% 80%, rgba(16,185,129,.25), transparent 35%), #07120d",

        red:
            "radial-gradient(circle at 15% 20%, rgba(239,68,68,.4), transparent 35%), radial-gradient(circle at 85% 80%, rgba(249,115,22,.25), transparent 35%), #150909",

        sunset:
            "radial-gradient(circle at 15% 20%, rgba(249,115,22,.45), transparent 35%), radial-gradient(circle at 85% 80%, rgba(236,72,153,.3), transparent 35%), #12090e",

        dark:
            "#050507",

        moving:
            "radial-gradient(circle at 15% 20%, rgba(139,92,246,.5), transparent 35%), radial-gradient(circle at 85% 80%, rgba(6,182,212,.3), transparent 35%), #090912"
    };

    bg.style.background =
        backgrounds[type] || backgrounds.purple;

    if (type === "moving") {
        bg.classList.add("moving");
    }

    localStorage.setItem("novaBackground", type);
}

function changeSidebar(value) {
    const opacity =
        Number(value) / 100;

    document.documentElement.style.setProperty(
        "--sidebar",
        `rgba(15,15,28,${opacity})`
    );

    document.getElementById("sidebarValue").textContent =
        value + "%";

    localStorage.setItem(
        "novaSidebar",
        value
    );
}

function setPanicKey() {
    document.getElementById("panicStatus").textContent =
        "Press any key...";

    function listener(event) {
        event.preventDefault();

        panicKey = event.key;

        localStorage.setItem(
            "novaPanicKey",
            panicKey
        );

        document.getElementById("panicStatus").textContent =
            "Panic key: " + panicKey;

        document.removeEventListener(
            "keydown",
            listener
        );
    }

    document.addEventListener(
        "keydown",
        listener
    );
}

function clearPanicKey() {
    panicKey = null;

    localStorage.removeItem(
        "novaPanicKey"
    );

    document.getElementById("panicStatus").textContent =
        "No panic key set.";
}

document.addEventListener(
    "keydown",
    event => {

        if (
            panicKey &&
            event.key === panicKey
        ) {
            document.getElementById(
                "panicScreen"
            ).classList.add("active");
        }

    }
);

function saveSettings() {
    localStorage.setItem(
        "novaClockFormat",
        document.getElementById("clockFormat").value
    );

    localStorage.setItem(
        "novaSeconds",
        document.getElementById("secondsSelect").value
    );
}

function resetSettings() {
    localStorage.removeItem("novaTheme");
    localStorage.removeItem("novaTheme2");
    localStorage.removeItem("novaFont");
    localStorage.removeItem("novaBackground");
    localStorage.removeItem("novaSidebar");
    localStorage.removeItem("novaClockFormat");
    localStorage.removeItem("novaSeconds");
    localStorage.removeItem("novaPanicKey");

    location.reload();
}

function loadSettings() {

    const font =
        localStorage.getItem("novaFont");

    if (font) {
        document.body.style.fontFamily =
            `"${font}", sans-serif`;

        document.getElementById(
            "fontSelect"
        ).value = font;
    }

    const theme =
        localStorage.getItem("novaTheme");

    const theme2 =
        localStorage.getItem("novaTheme2");

    if (theme) {
        setTheme(
            theme,
            theme2 || theme
        );
    }

    const background =
        localStorage.getItem("novaBackground");

    if (background) {
        document.getElementById(
            "backgroundSelect"
        ).value = background;

        changeBackground(background);
    }

    const sidebar =
        localStorage.getItem("novaSidebar");

    if (sidebar) {
        document.querySelector(
            'input[type="range"]'
        ).value = sidebar;

        changeSidebar(sidebar);
    }

    const format =
        localStorage.getItem("novaClockFormat");

    if (format) {
        document.getElementById(
            "clockFormat"
        ).value = format;
    }

    const seconds =
        localStorage.getItem("novaSeconds");

    if (seconds) {
        document.getElementById(
            "secondsSelect"
        ).value = seconds;
    }

    if (panicKey) {
        document.getElementById(
            "panicStatus"
        ).textContent =
            "Panic key: " + panicKey;
    }
}

loadSettings();
updateClock();
</script>

</body>
</html>
