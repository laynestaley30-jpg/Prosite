<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Lato:wght@400;700&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
    --theme: #8b5cf6;
    --theme2: #a78bfa;
    --background: #090912;
    --panel: rgba(15,15,25,.72);
    --text: #ffffff;
    --muted: rgba(255,255,255,.62);
    --blur: 18px;
    --opacity: .72;
    --sidebar-width: 76px;
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    overflow: hidden;
    color: var(--text);
    background: var(--background);
    font-family: "Space Grotesk", sans-serif;
}

/* =========================
   BACKGROUND
========================= */

.background {
    position: fixed;
    inset: 0;
    z-index: -10;
    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(139,92,246,.35),
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(76,29,149,.30),
            transparent 35%
        ),
        #090912;
    overflow: hidden;
}

.background::before,
.background::after {
    content: "";
    position: absolute;

    width: 55vw;
    height: 55vw;

    border-radius: 50%;

    filter: blur(80px);

    opacity: .22;

    animation: float 15s ease-in-out infinite alternate;
}

.background::before {
    background: var(--theme);

    left: -25vw;
    top: -25vw;
}

.background::after {
    background: var(--theme2);

    right: -25vw;
    bottom: -25vw;

    animation-delay: -6s;
}

@keyframes float {

    0% {
        transform: translate(0,0) scale(1);
    }

    100% {
        transform: translate(90px,60px) scale(1.18);
    }
}

/* =========================
   APP
========================= */

.app {
    width: 100%;
    height: 100%;

    display: flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: var(--sidebar-width);
    height: calc(100% - 28px);

    margin: 14px;

    padding: 10px 8px;

    display: flex;
    flex-direction: column;
    align-items: center;

    background: rgba(10,10,20,var(--opacity));

    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));

    border: 1px solid rgba(255,255,255,.09);

    border-radius: 23px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.28);
}

.sidebar-clock {
    width: 100%;

    text-align: center;

    margin: 5px 0 15px;

    color: var(--muted);

    font-size: 11px;

    font-weight: 600;
}

.sidebar-buttons {
    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 10px;

    width: 100%;
}

/* =========================
   BUTTONS
========================= */

.sidebar-button {
    position: relative;

    width: 50px;
    height: 50px;

    border: 0;

    border-radius: 16px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(255,255,255,.07);

    color: white;

    text-decoration: none;

    cursor: pointer;

    transition:
        transform .25s ease,
        background .25s ease;
}

.sidebar-button:hover {
    transform: scale(1.08);

    background: rgba(255,255,255,.14);
}

.sidebar-button::after {
    content: attr(data-label);

    position: absolute;

    left: 62px;
    top: 50%;

    transform:
        translateY(-50%)
        translateX(-6px);

    padding: 7px 10px;

    border-radius: 9px;

    background: rgba(8,8,15,.95);

    border: 1px solid rgba(255,255,255,.1);

    color: white;

    font-size: 12px;

    white-space: nowrap;

    opacity: 0;

    pointer-events: none;

    transition: .2s ease .35s;
}

.sidebar-button:hover::after {
    opacity: 1;

    transform:
        translateY(-50%)
        translateX(0);
}

/* =========================
   HOME ICON
========================= */

.home-button svg {
    width: 27px;
    height: 27px;

    fill: var(--theme);

    transition: .25s ease;
}

.home-button:hover svg {
    fill: var(--theme2);
}

/* =========================
   IMAGE LOGOS
========================= */

.logo-button {
    overflow: hidden;
}

.logo-button img {
    width: 30px;
    height: 30px;

    object-fit: contain;

    display: block;

    border-radius: 9px;
}

/*
   Steam gets a white rounded
   container because your Steam
   image is being used as a logo.
*/

.steam-button {
    background: white;
}

.steam-button:hover {
    background: white;
}

.steam-button img {
    width: 31px;
    height: 31px;

    border-radius: 9px;
}

/*
   Spotify and Discord stay
   transparent.
*/

.spotify-button,
.discord-button {
    background: rgba(255,255,255,.07);
}

/* =========================
   SETTINGS
========================= */

.bottom {
    margin-top: auto;
}

.settings-button svg {
    width: 27px;
    height: 27px;

    fill: var(--theme);

    transition: transform .35s ease;
}

.settings-button:hover svg {
    transform: rotate(35deg);
}

/* =========================
   MAIN
========================= */

.main {
    flex: 1;

    height: 100%;

    overflow-y: auto;

    padding: 35px 50px;
}

.home {
    min-height: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;
}

/* =========================
   WELCOME
========================= */

.welcome {
    text-align: center;

    margin-top: 25px;
}

.welcome h1 {
    margin: 0;

    font-size:
        clamp(42px,6vw,72px);

    font-weight: 600;

    letter-spacing: -3px;
}

.welcome h1 span {
    color: var(--theme2);
}

.welcome p {
    margin: 8px 0 0;

    color: var(--muted);

    font-size: 14px;
}

/* =========================
   CLOCK
========================= */

.clock {
    margin-top: 12px;

    text-align: center;
}

.clock-time {
    font-size:
        clamp(30px,4vw,48px);

    letter-spacing: -1px;

    font-weight: 500;
}

.clock-date {
    margin-top: 2px;

    color: var(--muted);

    font-size: 12px;
}

/* =========================
   QUICK CARDS
========================= */

.quick-links {
    width: min(900px,100%);

    margin-top: 42px;

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(190px,1fr)
        );

    gap: 15px;
}

.card {
    padding: 21px;

    border-radius: 19px;

    background: rgba(255,255,255,.055);

    border:
        1px solid
        rgba(255,255,255,.08);

    transition: .25s ease;

    cursor: pointer;
}

.card:hover {
    transform: translateY(-4px);

    background:
        rgba(255,255,255,.095);
}

.card h3 {
    margin: 0 0 6px;

    font-size: 16px;
}

.card p {
    margin: 0;

    color: var(--muted);

    font-size: 12px;
}

/* =========================
   SETTINGS WINDOW
========================= */

.overlay {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    background:
        rgba(0,0,0,.58);

    backdrop-filter: blur(8px);
}

.overlay.show {
    display: flex;
}

.settings {
    width:
        min(650px,calc(100% - 30px));

    max-height: 85vh;

    overflow-y: auto;

    padding: 25px;

    border-radius: 24px;

    background:
        rgba(15,15,27,.96);

    border:
        1px solid
        rgba(255,255,255,.1);
}

.settings-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 20px;
}

.settings-header h2 {
    margin: 0;
}

.close {
    width: 36px;
    height: 36px;

    border: 0;

    border-radius: 10px;

    background:
        rgba(255,255,255,.07);

    color: white;

    font-size: 18px;

    cursor: pointer;
}

.section {
    padding: 17px 0;

    border-top:
        1px solid
        rgba(255,255,255,.08);
}

.section h3 {
    margin: 0 0 13px;

    font-size: 14px;
}

.row {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 15px;

    margin: 12px 0;
}

.row label {
    color: var(--muted);

    font-size: 13px;
}

select {
    min-width: 170px;

    padding: 9px 11px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius: 10px;

    background: #171722;

    color: white;

    font-family: inherit;
}

input[type="color"] {
    width: 55px;
    height: 35px;

    border: 0;

    background: transparent;
}

input[type="range"] {
    width: 170px;

    accent-color: var(--theme);
}

.option-buttons {
    display: flex;

    flex-wrap: wrap;

    gap: 8px;
}

.option-buttons button {
    padding: 9px 13px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius: 10px;

    background:
        rgba(255,255,255,.06);

    color: white;

    font-family: inherit;

    cursor: pointer;
}

.option-buttons button:hover {
    background:
        rgba(255,255,255,.14);
}

/* =========================
   LAYOUTS
========================= */

body.compact {
    --sidebar-width: 67px;
}

body.wide {
    --sidebar-width: 90px;
}

body.wide .main {
    padding-left: 75px;
    padding-right: 75px;
}

body.centered .main {
    display: flex;

    justify-content: center;
}

body.centered .home {
    width: min(1050px,100%);
}

body.minimal .quick-links {
    display: none;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    .sidebar {
        width: 66px;

        margin: 9px;

        height: calc(100% - 18px);
    }

    .sidebar-button {
        width: 44px;
        height: 44px;
    }

    .sidebar-button::after {
        display: none;
    }

    .main {
        padding: 25px 18px;
    }

    .quick-links {
        grid-template-columns: 1fr;
    }

}

</style>
</head>


<body>

<div
    class="background"
    id="background">
</div>


<div class="app">

<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar">

    <div
        class="sidebar-clock"
        id="sidebarClock">
        12:00
    </div>


    <div class="sidebar-buttons">


        <!-- HOME -->

        <button
            class="sidebar-button home-button"
            data-label="Home"
            onclick="goHome()">

            <svg
                viewBox="0 0 24 24">

                <path
                    d="M12 3 3 10.5v9.2c0 .7.5 1.3 1.3 1.3h5.1v-6h5.2v6h5.1c.8 0 1.3-.6 1.3-1.3v-9.2L12 3z"/>

            </svg>

        </button>


        <!-- STEAM -->

        <a
            href="#"
            class="sidebar-button logo-button steam-button"
            data-label="Games">

            <img
                src="Steam.png"
                alt="Steam">

        </a>


        <!-- SPOTIFY -->

        <a
            href="#"
            class="sidebar-button logo-button spotify-button"
            data-label="Spotify">

            <img
                src="Spotify.png"
                alt="Spotify">

        </a>


        <!-- DISCORD -->

        <a
            href="#"
            class="sidebar-button logo-button discord-button"
            data-label="Discord">

            <img
                src="Discord.png"
                alt="Discord">

        </a>


        <!-- BROWSER -->

        <a
            href="./Browser.html"
            class="sidebar-button logo-button"
            data-label="Browser">

            <img
                src="https://cdn.simpleicons.org/google/4285F4"
                alt="Google">

        </a>

    </div>


    <!-- SETTINGS -->

    <div class="bottom">

        <button
            class="sidebar-button settings-button"
            data-label="Settings"
            onclick="openSettings()">

            <svg
                viewBox="0 0 24 24">

                <path
                    d="M19.4 13.5c.1-.5.1-1 0-1.5l2-1.5-2-3.4-2.4 1c-.4-.3-.9-.6-1.4-.8L15.3 4h-4l-.3 2.3c-.5.2-1 .5-1.4.8l-2.4-1-2 3.4 2 1.5c-.1.5-.1 1 0 1.5l-2 1.5 2 3.4 2.4-1c.4.3.9.6 1.4.8l.3 2.3h4l.3-2.3c.5-.2 1-.5 1.4-.8l2.4 1 2-3.4-2-1.5zM13.3 15.3a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/>

            </svg>

        </button>

    </div>

</aside>


<!-- =========================
     MAIN
========================= -->

<main class="main">

<section class="home">


    <div class="welcome">

        <h1>
            Welcome to
            <span>Nova</span>
        </h1>

        <p>
            Your personal space on the web.
        </p>

    </div>


    <div class="clock">

        <div
            class="clock-time"
            id="clock">
            12:00
        </div>

        <div
            class="clock-date"
            id="date">
            Loading...
        </div>

    </div>


    <div class="quick-links">


        <div
            class="card"
            onclick="openBrowser()">

            <h3>🌐 Browser</h3>

            <p>
                Open Nova Browser.
            </p>

        </div>


        <div class="card">

            <h3>🎮 Games</h3>

            <p>
                Your game hub.
            </p>

        </div>


        <div class="card">

            <h3>🎵 Music</h3>

            <p>
                Your music.
            </p>

        </div>


        <div class="card">

            <h3>💬 Social</h3>

            <p>
                Your social apps.
            </p>

        </div>


    </div>

</section>

</main>

</div>


<!-- =========================
     SETTINGS
========================= -->

<div
    class="overlay"
    id="settingsOverlay"
    onclick="outsideSettings(event)">


<div class="settings">


    <div class="settings-header">

        <h2>
            Nova Settings
        </h2>

        <button
            class="close"
            onclick="closeSettings()">
            ×
        </button>

    </div>


    <!-- FONT -->

    <div class="section">

        <h3>
            Font
        </h3>

        <div class="row">

            <label>
                Font
            </label>

            <select
                id="fontSelect"
                onchange="setFont(this.value)">

                <option>
                    Space Grotesk
                </option>

                <option>
                    Inter
                </option>

                <option>
                    Poppins
                </option>

                <option>
                    Montserrat
                </option>

                <option>
                    Roboto
                </option>

                <option>
                    Lato
                </option>

                <option>
                    Orbitron
                </option>

            </select>

        </div>

    </div>


    <!-- THEMES -->

    <div class="section">

        <h3>
            Theme
        </h3>

        <div class="option-buttons">

            <button onclick="theme('#8b5cf6','#a78bfa')">
                Purple
            </button>

            <button onclick="theme('#3b82f6','#60a5fa')">
                Blue
            </button>

            <button onclick="theme('#22c55e','#86efac')">
                Green
            </button>

            <button onclick="theme('#ef4444','#f87171')">
                Red
            </button>

            <button onclick="theme('#f97316','#fb923c')">
                Orange
            </button>

            <button onclick="theme('#ec4899','#f472b6')">
                Pink
            </button>

            <button onclick="theme('#06b6d4','#67e8f9')">
                Cyan
            </button>

        </div>

    </div>


    <!-- CUSTOM COLOR -->

    <div class="section">

        <h3>
            Custom Color
        </h3>

        <div class="row">

            <label>
                Choose color
            </label>

            <input
                id="colorPicker"
                type="color"
                value="#8b5cf6"
                onchange="customTheme(this.value)">

        </div>

    </div>


    <!-- BACKGROUNDS -->

    <div class="section">

        <h3>
            Moving Backgrounds
        </h3>

        <div class="option-buttons">

            <button onclick="backgroundType('nova')">
                Nova
            </button>

            <button onclick="backgroundType('ocean')">
                Ocean
            </button>

            <button onclick="backgroundType('emerald')">
                Emerald
            </button>

            <button onclick="backgroundType('crimson')">
                Crimson
            </button>

            <button onclick="backgroundType('aurora')">
                Aurora
            </button>

            <button onclick="backgroundType('dark')">
                Dark
            </button>

        </div>

    </div>


    <!-- LAYOUT -->

    <div class="section">

        <h3>
            Layout
        </h3>

        <div class="option-buttons">

            <button onclick="layout('classic')">
                Classic
            </button>

            <button onclick="layout('compact')">
                Compact
            </button>

            <button onclick="layout('wide')">
                Wide
            </button>

            <button onclick="layout('centered')">
                Centered
            </button>

            <button onclick="layout('minimal')">
                Minimal
            </button>

        </div>

    </div>


    <!-- SIDEBAR -->

    <div class="section">

        <h3>
            Sidebar
        </h3>

        <div class="row">

            <label>
                Transparency
            </label>

            <input
                id="opacity"
                type="range"
                min="30"
                max="95"
                value="72"
                oninput="changeOpacity(this.value)">

        </div>


        <div class="row">

            <label>
                Blur
            </label>

            <input
                id="blur"
                type="range"
                min="0"
                max="35"
                value="18"
                oninput="changeBlur(this.value)">

        </div>

    </div>


    <!-- CLOCK -->

    <div class="section">

        <h3>
            Clock
        </h3>

        <div class="row">

            <label>
                24-hour clock
            </label>

            <input
                id="clock24"
                type="checkbox"
                onchange="saveClock()">

        </div>


        <div class="row">

            <label>
                Show seconds
            </label>

            <input
                id="seconds"
                type="checkbox"
                checked
                onchange="saveClock()">

        </div>


        <div class="row">

            <label>
                Show date
            </label>

            <input
                id="showDate"
                type="checkbox"
                checked
                onchange="saveClock()">

        </div>

    </div>


</div>

</div>


<script>

/* =========================
   CLOCK
========================= */

function updateClock() {

    const now =
        new Date();

    const is24 =
        document.getElementById(
            "clock24"
        ).checked;

    const seconds =
        document.getElementById(
            "seconds"
        ).checked;

    const options = {
        hour: "numeric",
        minute: "2-digit",
        hour12: !is24
    };

    if (seconds) {
        options.second = "2-digit";
    }

    document.getElementById(
        "clock"
    ).textContent =
        now.toLocaleTimeString(
            [],
            options
        );

    document.getElementById(
        "sidebarClock"
    ).textContent =
        now.toLocaleTimeString(
            [],
            {
                hour: "numeric",
                minute: "2-digit",
                hour12: !is24
            }
        );

    document.getElementById(
        "date"
    ).textContent =
        now.toLocaleDateString(
            [],
            {
                weekday: "long",
                month: "long",
                day: "numeric",
                year: "numeric"
            }
        );
}

setInterval(
    updateClock,
    1000
);

updateClock();


/* =========================
   BROWSER
========================= */

function openBrowser() {

    window.location.href =
        "./Browser.html";
}


/* =========================
   HOME
========================= */

function goHome() {

    window.location.href =
        "./index.html";
}


/* =========================
   SETTINGS
========================= */

function openSettings() {

    document
        .getElementById(
            "settingsOverlay"
        )
        .classList.add("show");
}

function closeSettings() {

    document
        .getElementById(
            "settingsOverlay"
        )
        .classList.remove("show");
}

function outsideSettings(event) {

    if (
        event.target.id ===
        "settingsOverlay"
    ) {
        closeSettings();
    }
}


/* =========================
   FONT
========================= */

function setFont(font) {

    document.body.style.fontFamily =
        `"${font}", sans-serif`;

    localStorage.setItem(
        "novaFont",
        font
    );
}


/* =========================
   THEME
========================= */

function theme(color,color2) {

    document.documentElement
        .style
        .setProperty(
            "--theme",
            color
        );

    document.documentElement
        .style
        .setProperty(
            "--theme2",
            color2
        );

    document.getElementById(
        "colorPicker"
    ).value = color;

    localStorage.setItem(
        "novaTheme",
        color
    );

    localStorage.setItem(
        "novaTheme2",
        color2
    );
}


/* =========================
   CUSTOM THEME
========================= */

function customTheme(color) {

    theme(
        color,
        color
    );
}


/* =========================
   BACKGROUNDS
========================= */

function backgroundType(type) {

    const bg =
        document.getElementById(
            "background"
        );

    if (type === "nova") {

        bg.style.background =
        `
        radial-gradient(
            circle at 15% 20%,
            rgba(139,92,246,.35),
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(76,29,149,.30),
            transparent 35%
        ),
        #090912
        `;

    }


    if (type === "ocean") {

        bg.style.background =
        `
        radial-gradient(
            circle at 15% 20%,
            rgba(59,130,246,.38),
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(6,182,212,.30),
            transparent 35%
        ),
        #050b13
        `;

    }


    if (type === "emerald") {

        bg.style.background =
        `
        radial-gradient(
            circle at 15% 20%,
            rgba(34,197,94,.38),
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(5,150,105,.30),
            transparent 35%
        ),
        #050d0a
        `;

    }


    if (type === "crimson") {

        bg.style.background =
        `
        radial-gradient(
            circle at 15% 20%,
            rgba(239,68,68,.38),
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(190,24,93,.30),
            transparent 35%
        ),
        #120607
        `;

    }


    if (type === "aurora") {

        bg.style.background =
        `
        radial-gradient(
            circle at 15% 20%,
            rgba(34,197,94,.35),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 20%,
            rgba(59,130,246,.35),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 85%,
            rgba(168,85,247,.35),
            transparent 35%
        ),
        #070b12
        `;

    }


    if (type === "dark") {

        bg.style.background =
            "#08080d";

    }

    localStorage.setItem(
        "novaBackground",
        type
    );
}


/* =========================
   LAYOUT
========================= */

function layout(type) {

    document.body.classList.remove(
        "compact",
        "wide",
        "centered",
        "minimal"
    );

    if (type !== "classic") {

        document.body.classList.add(
            type
        );
    }

    localStorage.setItem(
        "novaLayout",
        type
    );
}


/* =========================
   SIDEBAR SETTINGS
========================= */

function changeOpacity(value) {

    document.documentElement
        .style
        .setProperty(
            "--opacity",
            Number(value) / 100
        );

    localStorage.setItem(
        "novaOpacity",
        value
    );
}


function changeBlur(value) {

    document.documentElement
        .style
        .setProperty(
            "--blur",
            value + "px"
        );

    localStorage.setItem(
        "novaBlur",
        value
    );
}


/* =========================
   CLOCK SETTINGS
========================= */

function saveClock() {

    localStorage.setItem(
        "nova24",
        document.getElementById(
            "clock24"
        ).checked
    );

    localStorage.setItem(
        "novaSeconds",
        document.getElementById(
            "seconds"
        ).checked
    );

    localStorage.setItem(
        "novaShowDate",
        document.getElementById(
            "showDate"
        ).checked
    );

    document.getElementById(
        "date"
    ).style.display =
        document.getElementById(
            "showDate"
        ).checked
        ? "block"
        : "none";

    updateClock();
}


/* =========================
   LOAD SAVED SETTINGS
========================= */

function loadSettings() {

    const font =
        localStorage.getItem(
            "novaFont"
        );

    if (font) {

        setFont(font);

        document.getElementById(
            "fontSelect"
        ).value = font;
    }


    const savedTheme =
        localStorage.getItem(
            "novaTheme"
        );

    const savedTheme2 =
        localStorage.getItem(
            "novaTheme2"
        );

    if (savedTheme) {

        theme(
            savedTheme,
            savedTheme2 || savedTheme
        );
    }


    const savedBackground =
        localStorage.getItem(
            "novaBackground"
        );

    if (savedBackground) {

        backgroundType(
            savedBackground
        );
    }


    const savedLayout =
        localStorage.getItem(
            "novaLayout"
        );

    if (savedLayout) {

        layout(savedLayout);
    }


    const opacity =
        localStorage.getItem(
            "novaOpacity"
        );

    if (opacity) {

        document.getElementById(
            "opacity"
        ).value = opacity;

        changeOpacity(opacity);
    }


    const blur =
        localStorage.getItem(
            "novaBlur"
        );

    if (blur) {

        document.getElementById(
            "blur"
        ).value = blur;

        changeBlur(blur);
    }


    const is24 =
        localStorage.getItem(
            "nova24"
        );

    if (is24 === "true") {

        document.getElementById(
            "clock24"
        ).checked = true;
    }


    const seconds =
        localStorage.getItem(
            "novaSeconds"
        );

    if (seconds === "false") {

        document.getElementById(
            "seconds"
        ).checked = false;
    }


    const showDate =
        localStorage.getItem(
            "novaShowDate"
        );

    if (showDate === "false") {

        document.getElementById(
            "showDate"
        ).checked = false;

        document.getElementById(
            "date"
        ).style.display = "none";
    }

    updateClock();
}

loadSettings();

</script>

</body>
</html>
