<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nova Settings</title>

<style>
body{
margin:0;
min-height:100vh;
font-family:Arial,sans-serif;
color:white;
background:
radial-gradient(circle at 20% 20%,rgba(139,92,246,.3),transparent 35%),
#080810;
}

header{
height:70px;
display:flex;
align-items:center;
padding:0 20px;
border-bottom:1px solid rgba(255,255,255,.08);
}

button{
border:0;
border-radius:10px;
padding:10px 14px;
background:rgba(255,255,255,.08);
color:white;
cursor:pointer;
margin-right:15px;
}

main{
padding:35px;
max-width:700px;
}

h1{
font-size:40px;
}

span{
color:#a78bfa;
}

.setting{
margin-top:15px;
padding:20px;
border-radius:18px;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.08);
}

.setting h3{
margin:0 0 7px;
}

.setting p{
margin:0;
color:rgba(255,255,255,.6);
font-size:13px;
}
</style>
</head>

<body>

<header>
<button onclick="location.href='index.html'">←</button>
<strong>⚙️ Nova Settings</strong>
</header>

<main>

<h1>Nova <span>Settings</span></h1>

<div class="setting">
<h3>🎨 Theme</h3>
<p>Nova Purple</p>
</div>

<div class="setting">
<h3>🤖 AI</h3>
<p>Nova AI connection enabled.</p>
</div>

<div class="setting">
<h3>🎮 Games</h3>
<p>Nova Games enabled.</p>
</div>

</main>

</body>
</html>
