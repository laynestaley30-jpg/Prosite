<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Browser</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Space Grotesk", sans-serif;
    background: #080812;
    color: white;
}

.browser {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

/* TABS */

.tabs {
    height: 48px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 10px 0;
    background: rgba(10,10,20,.96);
    border-bottom: 1px solid rgba(255,255,255,.08);
    overflow-x: auto;
}

.tab {
    height: 40px;
    min-width: 150px;
    max-width: 230px;
    padding: 0 12px;

    display: flex;
    align-items: center;
    gap: 8px;

    background: rgba(255,255,255,.06);
    border-radius: 12px 12px 0 0;

    color: #aaa;
    cursor: pointer;
    user-select: none;
}

.tab.active {
    background: rgba(255,255,255,.12);
    color: white;
}

.tab-title {
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.close-tab {
    color: #888;
    cursor: pointer;
}

.close-tab:hover {
    color: white;
}

.new-tab {
    flex-shrink: 0;
    width: 38px;
    height: 38px;

    border: 0;
    border-radius: 10px;

    background: transparent;
    color: white;

    font-size: 22px;
    cursor: pointer;
}

.new-tab:hover {
    background: rgba(255,255,255,.08);
}

/* TOOLBAR */

.toolbar {
    height: 58px;

    display: flex;
    align-items: center;
    gap: 8px;

    padding: 8px 12px;

    background: rgba(12,12,24,.97);
    border-bottom: 1px solid rgba(255,255,255,.08);
}

.tool-button {
    width: 38px;
    height: 38px;

    flex-shrink: 0;

    border: 0;
    border-radius: 10px;

    background: rgba(255,255,255,.06);
    color: white;

    font-size: 17px;
    cursor: pointer;
}

.tool-button:hover {
    background: rgba(255,255,255,.14);
}

.address {
    flex: 1;
    height: 40px;

    min-width: 0;

    border: 1px solid rgba(255,255,255,.1);
    border-radius: 13px;

    background: rgba(255,255,255,.06);
    color: white;

    outline: none;

    padding: 0 15px;

    font-family: inherit;
    font-size: 14px;
}

.address:focus {
    border-color: #8b5cf6;
}

.go {
    height: 40px;
    padding: 0 17px;

    border: 0;
    border-radius: 12px;

    background: #8b5cf6;
    color: white;

    font-family: inherit;
    cursor: pointer;
}

.go:hover {
    filter: brightness(1.12);
}

/* CONTENT */

.content {
    position: relative;
    flex: 1;
    background: #090912;
}

.browser-page {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    border: 0;
    display: none;
}

.browser-page.active {
    display: block;
}

/* HOME */

.start-page {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(139,92,246,.4),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(168,85,247,.25),
            transparent 35%
        ),
        #080812;
}

.start-page h1 {
    margin: 0;
    font-size: clamp(40px, 7vw, 65px);
    letter-spacing: -2px;
}

.start-page h1 span {
    color: #8b5cf6;
}

.start-page p {
    margin-top: 8px;
    color: #aaa;
}

.start-search {
    width: min(650px, 85%);
    height: 54px;

    margin-top: 28px;
    padding: 0 20px;

    border-radius: 18px;
    border: 1px solid rgba(255,255,255,.12);

    background: rgba(255,255,255,.07);
    color: white;

    outline: none;

    font-family: inherit;
    font-size: 16px;
}

.start-search:focus {
    border-color: #8b5cf6;
}

.error-page {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
    background: #090912;
}

.error-box {
    width: min(500px, 90%);
}

.error-box h1 {
    font-size: 50px;
    margin: 0 0 10px;
}

.error-box p {
    color: #aaa;
    line-height: 1.6;
}

.error-box button {
    margin-top: 18px;
    padding: 12px 20px;

    border: 0;
    border-radius: 10px;

    background: #8b5cf6;
    color: white;

    font-family: inherit;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="browser">

    <div class="tabs" id="tabs"></div>

    <div class="toolbar">

        <button class="tool-button"
                onclick="goBack()"
                title="Back">
            ←
        </button>

        <button class="tool-button"
                onclick="goForward()"
                title="Forward">
            →
        </button>

        <button class="tool-button"
                onclick="reloadPage()"
                title="Reload">
            ↻
        </button>

        <button class="tool-button"
                onclick="goHome()"
                title="Home">
            ⌂
        </button>

        <input
            class="address"
            id="address"
            placeholder="Search Google or enter a URL"
            autocomplete="off"
            onkeydown="addressKey(event)"
        >

        <button class="go"
                onclick="navigate()">
            Go
        </button>

    </div>

    <div class="content" id="content"></div>

</div>

<script>
let tabs = [];
let activeTab = null;

function createTab(url = null) {

    const id =
        Date.now() + Math.random();

    const tab = {
        id,
        title: "New Tab",
        url,
        history: [],
        historyIndex: -1
    };

    tabs.push(tab);
    activeTab = id;

    renderTabs();
    renderContent();
}

function currentTab() {
    return tabs.find(
        tab => tab.id === activeTab
    );
}

function renderTabs() {

    const tabsElement =
        document.getElementById("tabs");

    tabsElement.innerHTML = "";

    tabs.forEach(tab => {

        const element =
            document.createElement("div");

        element.className =
            "tab" +
            (tab.id === activeTab
                ? " active"
                : "");

        element.onclick = () => {
            activeTab = tab.id;
            renderTabs();
            renderContent();
        };

        const title =
            document.createElement("span");

        title.className = "tab-title";
        title.textContent = tab.title;

        const close =
            document.createElement("span");

        close.className = "close-tab";
        close.textContent = "×";

        close.onclick = event => {
            event.stopPropagation();
            closeTab(tab.id);
        };

        element.appendChild(title);
        element.appendChild(close);

        tabsElement.appendChild(element);
    });

    const newButton =
        document.createElement("button");

    newButton.className = "new-tab";
    newButton.textContent = "+";

    newButton.onclick = () => createTab();

    tabsElement.appendChild(newButton);
}

function closeTab(id) {

    if (tabs.length === 1) {

        const tab = tabs[0];

        tab.title = "New Tab";
        tab.url = null;
        tab.history = [];
        tab.historyIndex = -1;

        renderTabs();
        renderContent();

        return;
    }

    const index =
        tabs.findIndex(tab => tab.id === id);

    tabs = tabs.filter(
        tab => tab.id !== id
    );

    if (activeTab === id) {
        activeTab =
            tabs[Math.max(0, index - 1)].id;
    }

    renderTabs();
    renderContent();
}

function renderContent() {

    const content =
        document.getElementById("content");

    const tab = currentTab();

    content.innerHTML = "";

    if (!tab.url) {

        content.innerHTML = `
            <div class="start-page">
                <h1>
                    Nova <span>Browser</span>
                </h1>

                <p>
                    Search the web.
                </p>

                <input
                    class="start-search"
                    id="startSearch"
                    placeholder="Search Google or enter a URL"
                    onkeydown="startSearchKey(event)"
                >
            </div>
        `;

        document.getElementById(
            "address"
        ).value = "";

        return;
    }

    document.getElementById(
        "address"
    ).value = tab.url;

    const iframe =
        document.createElement("iframe");

    iframe.className =
        "browser-page active";

    iframe.src = tab.url;

    iframe.onload = () => {

        try {
            tab.title =
                iframe.contentDocument.title ||
                tab.url;
        } catch {
            tab.title = tab.url;
        }

        renderTabs();
    };

    iframe.onerror = () => {
        showError();
    };

    content.appendChild(iframe);
}

function navigate() {

    const input =
        document.getElementById("address");

    let value =
        input.value.trim();

    if (!value) return;

    let url;

    if (
        value.startsWith("https://") ||
        value.startsWith("http://")
    ) {
        url = value;
    }
    else if (
        value.includes(".") &&
        !value.includes(" ")
    ) {
        url = "https://" + value;
    }
    else {
        url =
            "https://www.google.com/search?q=" +
            encodeURIComponent(value);
    }

    const tab = currentTab();

    tab.url = url;
    tab.title = "Loading...";

    if (
        tab.historyIndex <
        tab.history.length - 1
    ) {
        tab.history =
            tab.history.slice(
                0,
                tab.historyIndex + 1
            );
    }

    tab.history.push(url);

    tab.historyIndex =
        tab.history.length - 1;

    renderTabs();
    renderContent();
}

function addressKey(event) {
    if (event.key === "Enter") {
        navigate();
    }
}

function startSearchKey(event) {

    if (event.key !== "Enter") return;

    const input =
        document.getElementById(
            "startSearch"
        );

    document.getElementById(
        "address"
    ).value = input.value;

    navigate();
}

function goHome() {

    const tab = currentTab();

    tab.url = null;
    tab.title = "New Tab";

    renderTabs();
    renderContent();
}

function reloadPage() {
    renderContent();
}

function goBack() {

    const tab = currentTab();

    if (tab.historyIndex <= 0) return;

    tab.historyIndex--;

    tab.url =
        tab.history[tab.historyIndex];

    renderContent();
}

function goForward() {

    const tab = currentTab();

    if (
        tab.historyIndex >=
        tab.history.length - 1
    ) return;

    tab.historyIndex++;

    tab.url =
        tab.history[tab.historyIndex];

    renderContent();
}

function showError() {

    document.getElementById(
        "content"
    ).innerHTML = `
        <div class="error-page">
            <div class="error-box">

                <h1>🌐</h1>

                <h2>
                    This site can't be displayed here
                </h2>

                <p>
                    This website doesn't allow itself
                    to be embedded inside another website.
                    This is controlled by the website's
                    security settings.
                </p>

                <button onclick="openExternal()">
                    Open Normally
                </button>

            </div>
        </div>
    `;
}

function openExternal() {

    const tab = currentTab();

    if (!tab.url) return;

    window.open(
        tab.url,
        "_blank",
        "noopener"
    );
}

createTab();
</script>

</body>
</html>
