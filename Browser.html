<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Browser</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #202124;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.browser {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

/* Tabs */

.tabs {
    height: 42px;
    background: #171717;
    display: flex;
    align-items: flex-end;
    padding-left: 8px;
    gap: 4px;
}

.tab {
    height: 36px;
    min-width: 150px;
    max-width: 220px;
    padding: 0 12px;
    border-radius: 10px 10px 0 0;
    background: #2b2b2b;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
}

.tab.active {
    background: #303134;
}

.tab-close {
    margin-left: 10px;
    cursor: pointer;
    opacity: .7;
}

.new-tab {
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: white;
    font-size: 22px;
    cursor: pointer;
}

.new-tab:hover {
    background: #303134;
}

/* Toolbar */

.toolbar {
    height: 58px;
    background: #303134;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
}

.tool {
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: white;
    font-size: 19px;
    cursor: pointer;
}

.tool:hover {
    background: #414247;
}

.address {
    flex: 1;
    height: 40px;
    border: 0;
    outline: none;
    border-radius: 20px;
    padding: 0 18px;
    background: #202124;
    color: white;
    font-size: 14px;
}

.address:focus {
    background: #171717;
}

/* Page */

.page {
    flex: 1;
    background: #ffffff;
    color: #202124;
    overflow: auto;
}

.home {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.logo {
    font-size: 58px;
    font-weight: bold;
    letter-spacing: -4px;
}

.logo span {
    color: #8b5cf6;
}

.subtitle {
    color: #666;
    margin-top: 8px;
}

.search {
    margin-top: 25px;
    width: min(600px, 85%);
    height: 48px;
    display: flex;
    border: 1px solid #ddd;
    border-radius: 24px;
    overflow: hidden;
}

.search input {
    flex: 1;
    border: 0;
    outline: 0;
    padding: 0 18px;
    font-size: 15px;
}

.search button {
    width: 100px;
    border: 0;
    background: #8b5cf6;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.message {
    margin-top: 25px;
    color: #777;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="browser">

    <div class="tabs">

        <div class="tab active">
            <span>New Tab</span>
            <span class="tab-close">×</span>
        </div>

        <button class="new-tab" onclick="newTab()">+</button>

    </div>

    <div class="toolbar">

        <button class="tool" onclick="goBack()">←</button>

        <button class="tool" onclick="goForward()">→</button>

        <button class="tool" onclick="refresh()">↻</button>

        <button class="tool" onclick="home()">⌂</button>

        <input
            id="address"
            class="address"
            placeholder="Search Google or enter a URL"
            autocomplete="off"
        >

    </div>

    <main class="page">

        <div class="home">

            <div class="logo">
                Nova<span>.</span>
            </div>

            <div class="subtitle">
                Mini Browser
            </div>

            <div class="search">

                <input
                    id="search"
                    placeholder="Search Google"
                    autocomplete="off"
                >

                <button onclick="searchGoogle()">
                    Search
                </button>

            </div>

            <div class="message">
                Browser shell loaded successfully.
            </div>

        </div>

    </main>

</div>

<script>

const address =
    document.getElementById("address");

const search =
    document.getElementById("search");

function searchGoogle() {

    const text = search.value.trim();

    if (!text) return;

    const url =
        "https://www.google.com/search?q=" +
        encodeURIComponent(text);

    window.open(url, "_blank");
}

function navigate() {

    const text = address.value.trim();

    if (!text) return;

    let url;

    if (
        text.startsWith("https://") ||
        text.startsWith("http://")
    ) {
        url = text;
    } else {
        url =
            "https://www.google.com/search?q=" +
            encodeURIComponent(text);
    }

    window.open(url, "_blank");
}

function home() {

    address.value = "";

    search.value = "";
}

function refresh() {

    location.reload();
}

function goBack() {

    history.back();
}

function goForward() {

    history.forward();
}

function newTab() {

    window.open(
        window.location.href,
        "_blank"
    );
}

address.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            navigate();
        }

    }
);

search.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            searchGoogle();
        }

    }
);

</script>

</body>
</html>
