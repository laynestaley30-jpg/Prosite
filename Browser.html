<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Nova Browser</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    background: #111318;
    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow: hidden;
}


/* =========================
   TOP BAR
========================= */

.browser {

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
}


/* =========================
   TOOLBAR
========================= */

.toolbar {

    height: 58px;

    display: flex;
    align-items: center;

    gap: 8px;

    padding: 8px 12px;

    background: #1b1e24;

    border-bottom:
        1px solid
        #30343d;
}


/* =========================
   BUTTONS
========================= */

.tool-button {

    width: 38px;
    height: 38px;

    border: none;

    border-radius: 10px;

    background: #282c34;

    color: #ffffff;

    font-size: 18px;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;
}

.tool-button:hover {

    background: #353a45;
}


/* =========================
   ADDRESS BAR
========================= */

.address {

    flex: 1;

    height: 38px;

    padding:
        0 14px;

    border:
        1px solid
        #363b45;

    border-radius: 12px;

    outline: none;

    background: #111318;

    color: white;

    font-size: 14px;
}

.address:focus {

    border-color:
        #8b5cf6;
}


/* =========================
   PAGE
========================= */

.page {

    flex: 1;

    background: white;

    position: relative;
}


/* =========================
   IFRAME
========================= */

iframe {

    width: 100%;
    height: 100%;

    border: none;

    background: white;
}


/* =========================
   HOME PAGE
========================= */

.home {

    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(139,92,246,.20),
            transparent 35%
        ),

        radial-gradient(
            circle at 80% 80%,
            rgba(59,130,246,.15),
            transparent 35%
        ),

        #ffffff;

    color: #171717;
}

.home.hidden {

    display: none;
}

.home h1 {

    margin: 0;

    font-size: 54px;

    font-weight: 700;

    letter-spacing: -3px;
}

.home h1 span {

    color: #8b5cf6;
}

.home p {

    margin-top: 8px;

    color: #666;

    font-size: 14px;
}


/* =========================
   SEARCH
========================= */

.search-box {

    width:
        min(600px,80%);

    height: 48px;

    margin-top: 25px;

    display: flex;

    border:
        1px solid
        #ddd;

    border-radius: 15px;

    overflow: hidden;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.08);
}

.search-box input {

    flex: 1;

    border: none;

    outline: none;

    padding:
        0 16px;

    font-size: 15px;
}

.search-box button {

    width: 90px;

    border: none;

    background: #8b5cf6;

    color: white;

    font-weight: 600;

    cursor: pointer;
}

.search-box button:hover {

    background: #7c3aed;
}

</style>

</head>


<body>


<div class="browser">


<!-- =========================
     TOOLBAR
========================= -->

<div class="toolbar">


    <button
        class="tool-button"
        onclick="goBack()"
        title="Back">

        ←

    </button>


    <button
        class="tool-button"
        onclick="goForward()"
        title="Forward">

        →

    </button>


    <button
        class="tool-button"
        onclick="reloadPage()"
        title="Refresh">

        ↻

    </button>


    <button
        class="tool-button"
        onclick="goHome()"
        title="Home">

        ⌂

    </button>


    <input
        class="address"
        id="address"
        type="text"
        placeholder="Search Google or enter a URL"
        autocomplete="off">


</div>


<!-- =========================
     PAGE
========================= -->

<div class="page">


    <!-- NOVA HOME -->

    <div
        class="home"
        id="home">

        <h1>
            Nova<span>.</span>
        </h1>

        <p>
            Search the web.
        </p>


        <div class="search-box">

            <input
                id="search"
                type="text"
                placeholder="Search Google">

            <button
                onclick="searchGoogle()">

                Search

            </button>

        </div>

    </div>


    <!-- WEB PAGE -->

    <iframe
        id="frame"
        style="display:none;">
    </iframe>


</div>

</div>


<script>


/* =========================
   ELEMENTS
========================= */

const address =
    document.getElementById(
        "address"
    );

const search =
    document.getElementById(
        "search"
    );

const home =
    document.getElementById(
        "home"
    );

const frame =
    document.getElementById(
        "frame"
    );


/* =========================
   SEARCH
========================= */

function searchGoogle() {

    const query =
        search.value.trim();

    if (!query) {
        return;
    }

    const url =
        "https://www.google.com/search?q=" +
        encodeURIComponent(query);

    openPage(url);
}


/* =========================
   ADDRESS BAR
========================= */

function navigate() {

    let value =
        address.value.trim();

    if (!value) {
        return;
    }


    /*
       If the user types something
       that looks like a URL, open it.
    */

    if (
        value.startsWith("http://") ||
        value.startsWith("https://")
    ) {

        openPage(value);

        return;
    }


    /*
       Otherwise search Google.
    */

    const url =
        "https://www.google.com/search?q=" +
        encodeURIComponent(value);

    openPage(url);
}


/* =========================
   OPEN PAGE
========================= */

function openPage(url) {

    home.classList.add(
        "hidden"
    );

    frame.style.display =
        "block";

    frame.src = url;

    address.value = url;
}


/* =========================
   ENTER KEY
========================= */

address.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            navigate();

        }

    }
);


search.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            searchGoogle();

        }

    }
);


/* =========================
   HOME
========================= */

function goHome() {

    frame.style.display =
        "none";

    home.classList.remove(
        "hidden"
    );

    address.value = "";

    search.value = "";
}


/* =========================
   REFRESH
========================= */

function reloadPage() {

    if (
        frame.style.display !==
        "none"
    ) {

        frame.contentWindow.location.reload();

    }

}


/* =========================
   BACK
========================= */

function goBack() {

    try {

        frame.contentWindow.history.back();

    } catch(error) {

        console.log(error);

    }

}


/* =========================
   FORWARD
========================= */

function goForward() {

    try {

        frame.contentWindow.history.forward();

    } catch(error) {

        console.log(error);

    }

}

</script>

</body>

</html>
