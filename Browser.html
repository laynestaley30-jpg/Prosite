<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Browser</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #202124;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.browser {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

/* TABS */

.tabs {
    height: 42px;
    background: #171717;
    display: flex;
    align-items: flex-end;
    padding-left: 8px;
    gap: 4px;
}

.tab {
    height: 36px;
    min-width: 150px;
    max-width: 220px;
    padding: 0 12px;
    border-radius: 10px 10px 0 0;
    background: #2b2b2b;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
}

.tab.active {
    background: #303134;
}

.tab-close {
    margin-left: 10px;
    cursor: pointer;
    opacity: .7;
}

.new-tab {
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: white;
    font-size: 22px;
    cursor: pointer;
}

.new-tab:hover {
    background: #303134;
}

/* TOOLBAR */

.toolbar {
    height: 58px;
    background: #303134;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
}

.tool {
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: white;
    font-size: 19px;
    cursor: pointer;
}

.tool:hover {
    background: #414247;
}

.tool:disabled {
    opacity: .35;
    cursor: default;
}

.address {
    flex: 1;
    height: 40px;
    border: 0;
    outline: none;
    border-radius: 20px;
    padding: 0 18px;
    background: #202124;
    color: white;
    font-size: 14px;
}

.address:focus {
    background: #171717;
}

/* PAGE */

.page {
    flex: 1;
    background: white;
    color: #202124;
    overflow: auto;
}

.home {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.home.hidden {
    display: none;
}

.logo {
    font-size: 58px;
    font-weight: bold;
    letter-spacing: -4px;
}

.logo span {
    color: #8b5cf6;
}

.subtitle {
    color: #666;
    margin-top: 8px;
}

.search {
    margin-top: 25px;
    width: min(600px, 85%);
    height: 48px;
    display: flex;
    border: 1px solid #ddd;
    border-radius: 24px;
    overflow: hidden;
}

.search input {
    flex: 1;
    border: 0;
    outline: 0;
    padding: 0 18px;
    font-size: 15px;
}

.search button {
    width: 100px;
    border: 0;
    background: #8b5cf6;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.search button:hover {
    background: #7c3aed;
}

.message {
    margin-top: 25px;
    color: #777;
    font-size: 13px;
}

.notice {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: #202124;
    color: white;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
}

.notice.show {
    opacity: 1;
}
</style>
</head>

<body>

<div class="browser">

    <!-- TABS -->

    <div class="tabs">

        <div class="tab active" id="tab">

            <span id="tabTitle">
                New Tab
            </span>

            <span
                class="tab-close"
                onclick="closeTab()">
                ×
            </span>

        </div>

        <button
            class="new-tab"
            onclick="newTab()">
            +
        </button>

    </div>


    <!-- TOOLBAR -->

    <div class="toolbar">

        <button
            class="tool"
            id="backButton"
            onclick="goBack()"
            title="Back">
            ←
        </button>

        <button
            class="tool"
            id="forwardButton"
            onclick="goForward()"
            title="Forward">
            →
        </button>

        <button
            class="tool"
            onclick="refreshPage()"
            title="Refresh">
            ↻
        </button>

        <button
            class="tool"
            onclick="goHome()"
            title="Home">
            ⌂
        </button>

        <input
            id="address"
            class="address"
            placeholder="Search Google or enter a URL"
            autocomplete="off">

    </div>


    <!-- PAGE -->

    <main class="page">

        <div
            class="home"
            id="home">

            <div class="logo">
                Nova<span>.</span>
            </div>

            <div class="subtitle">
                Mini Browser
            </div>

            <div class="search">

                <input
                    id="search"
                    placeholder="Search Google"
                    autocomplete="off">

                <button onclick="searchGoogle()">
                    Search
                </button>

            </div>

            <div class="message">
                Browser shell loaded successfully.
            </div>

        </div>

    </main>

</div>


<div
    class="notice"
    id="notice">
</div>


<script>

/*
========================================
NOVA BROWSER HISTORY
========================================
*/

let historyStack = [
    "home"
];

let historyPosition = 0;


/*
========================================
ELEMENTS
========================================
*/

const address =
    document.getElementById("address");

const search =
    document.getElementById("search");

const home =
    document.getElementById("home");

const backButton =
    document.getElementById("backButton");

const forwardButton =
    document.getElementById("forwardButton");

const tabTitle =
    document.getElementById("tabTitle");

const notice =
    document.getElementById("notice");


/*
========================================
NOTICE
========================================
*/

function showNotice(text) {

    notice.textContent = text;

    notice.classList.add("show");

    setTimeout(function() {

        notice.classList.remove("show");

    }, 1800);
}


/*
========================================
SEARCH
========================================
*/

function searchGoogle() {

    const text =
        search.value.trim();

    if (!text) {
        return;
    }

    const url =
        "https://www.google.com/search?q=" +
        encodeURIComponent(text);

    navigateTo(url);
}


/*
========================================
ADDRESS BAR
========================================
*/

function navigate() {

    const text =
        address.value.trim();

    if (!text) {
        return;
    }

    let url;

    if (
        text.startsWith("https://") ||
        text.startsWith("http://")
    ) {

        url = text;

    } else {

        url =
            "https://www.google.com/search?q=" +
            encodeURIComponent(text);

    }

    navigateTo(url);
}


/*
========================================
NAVIGATE
========================================
*/

function navigateTo(url) {

    /*
       Add the page to our browser history.
    */

    historyStack =
        historyStack.slice(
            0,
            historyPosition + 1
        );

    historyStack.push(url);

    historyPosition++;

    openDestination(url);

    updateButtons();
}


/*
========================================
OPEN DESTINATION
========================================
*/

function openDestination(url) {

    /*
       External websites cannot reliably
       be embedded by GitHub Pages.

       So we open the destination in a
       normal browser tab.
    */

    if (url === "home") {

        goHomeDisplay();

        return;
    }

    window.open(
        url,
        "_blank"
    );

    address.value = url;

    tabTitle.textContent =
        getTitle(url);

    home.classList.add("hidden");

    showNotice(
        "Opened in a new browser tab."
    );
}


/*
========================================
BACK
========================================
*/

function goBack() {

    if (
        historyPosition <= 0
    ) {

        showNotice(
            "No previous page."
        );

        return;
    }

    historyPosition--;

    const destination =
        historyStack[
            historyPosition
        ];

    if (
        destination === "home"
    ) {

        goHomeDisplay();

    } else {

        openHistoryPage(
            destination
        );
    }

    updateButtons();
}


/*
========================================
FORWARD
========================================
*/

function goForward() {

    if (
        historyPosition >=
        historyStack.length - 1
    ) {

        showNotice(
            "No next page."
        );

        return;
    }

    historyPosition++;

    const destination =
        historyStack[
            historyPosition
        ];

    if (
        destination === "home"
    ) {

        goHomeDisplay();

    } else {

        openHistoryPage(
            destination
        );
    }

    updateButtons();
}


/*
========================================
OPEN HISTORY PAGE
========================================
*/

function openHistoryPage(url) {

    address.value = url;

    tabTitle.textContent =
        getTitle(url);

    home.classList.add(
        "hidden"
    );

    window.open(
        url,
        "_blank"
    );
}


/*
========================================
REFRESH
========================================
*/

function refreshPage() {

    location.reload();
}


/*
========================================
HOME
========================================
*/

function goHome() {

    /*
       Add home to browser history.
    */

    historyStack =
        historyStack.slice(
            0,
            historyPosition + 1
        );

    historyStack.push("home");

    historyPosition++;

    goHomeDisplay();

    updateButtons();
}


function goHomeDisplay() {

    home.classList.remove(
        "hidden"
    );

    address.value = "";

    search.value = "";

    tabTitle.textContent =
        "New Tab";
}


/*
========================================
NEW TAB
========================================
*/

function newTab() {

    window.open(
        window.location.href,
        "_blank"
    );
}


/*
========================================
CLOSE TAB
========================================
*/

function closeTab() {

    /*
       Browsers generally prevent
       JavaScript from closing a tab
       that wasn't opened by JavaScript.

       So return to Nova instead.
    */

    goHome();

    showNotice(
        "Returned to New Tab."
    );
}


/*
========================================
BUTTON STATE
========================================
*/

function updateButtons() {

    backButton.disabled =
        historyPosition <= 0;

    forwardButton.disabled =
        historyPosition >=
        historyStack.length - 1;
}


/*
========================================
TITLE
========================================
*/

function getTitle(url) {

    try {

        const parsed =
            new URL(url);

        return parsed.hostname;

    } catch {

        return "New Tab";
    }
}


/*
========================================
ENTER KEY
========================================
*/

address.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            navigate();
        }

    }
);


search.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            searchGoogle();
        }

    }
);


/*
========================================
INITIAL STATE
========================================
*/

updateButtons();

</script>

</body>
</html>
