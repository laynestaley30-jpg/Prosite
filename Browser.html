<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Browser</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --accent: #8b5cf6;
    --bg: #0b0b12;
    --bar: #151520;
    --bar2: #1c1c29;
    --text: #ffffff;
    --muted: #9b9ba8;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
}

/* TOP */

.browser {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;

    background:
        radial-gradient(
            circle at 20% 0%,
            rgba(139,92,246,.15),
            transparent 35%
        ),
        var(--bg);
}

/* TABS */

.tabs {
    height: 46px;

    display: flex;
    align-items: flex-end;

    padding: 7px 8px 0;

    gap: 6px;

    background:
        rgba(8,8,14,.92);

    border-bottom:
        1px solid rgba(255,255,255,.08);
}

.tab {
    height: 39px;

    min-width: 170px;
    max-width: 240px;

    padding: 0 12px;

    display: flex;
    align-items: center;

    gap: 9px;

    background:
        rgba(255,255,255,.045);

    border-radius:
        11px 11px 0 0;

    color: var(--muted);

    cursor: pointer;

    transition:
        background .2s ease;
}

.tab:hover {
    background:
        rgba(255,255,255,.08);
}

.tab.active {
    background:
        var(--bar);

    color: white;
}

.tab-title {
    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    flex: 1;

    font-size: 13px;
}

.tab-close {
    width: 22px;
    height: 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 0;
    border-radius: 6px;

    background: transparent;

    color: var(--muted);

    cursor: pointer;
}

.tab-close:hover {
    background:
        rgba(255,255,255,.1);

    color: white;
}

.new-tab {
    width: 35px;
    height: 35px;

    margin-bottom: 2px;

    border: 0;
    border-radius: 9px;

    background:
        transparent;

    color: white;

    font-size: 21px;

    cursor: pointer;
}

.new-tab:hover {
    background:
        rgba(255,255,255,.08);
}

/* TOOLBAR */

.toolbar {
    min-height: 58px;

    padding:
        9px 12px;

    display: flex;
    align-items: center;

    gap: 7px;

    background:
        var(--bar);

    border-bottom:
        1px solid rgba(255,255,255,.08);
}

.nav-button {
    width: 38px;
    height: 38px;

    flex-shrink: 0;

    border: 0;
    border-radius: 10px;

    background:
        rgba(255,255,255,.06);

    color: white;

    font-size: 18px;

    cursor: pointer;

    transition:
        background .2s ease,
        transform .15s ease;
}

.nav-button:hover {
    background:
        rgba(255,255,255,.12);

    transform:
        scale(1.04);
}

.nav-button:active {
    transform:
        scale(.95);
}

/* ADDRESS BAR */

.address-wrap {
    flex: 1;

    height: 40px;

    display: flex;
    align-items: center;

    padding:
        0 13px;

    gap: 9px;

    background:
        var(--bar2);

    border:
        1px solid rgba(255,255,255,.08);

    border-radius: 13px;
}

.lock {
    color: #6ee7b7;

    font-size: 13px;
}

.address {
    width: 100%;

    border: 0;
    outline: 0;
