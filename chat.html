


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Chat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
    --theme: #8b5cf6;
    --theme2: #a78bfa;
    --background: #090912;
    --text: #ffffff;
    --muted: rgba(255,255,255,.62);
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    overflow: hidden;
    color: var(--text);
    background: var(--background);
    font-family: "Space Grotesk", sans-serif;
}

/* =========================
BACKGROUND
========================= */

.background {
    position: fixed;
    inset: 0;
    z-index: -10;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(139,92,246,.35),
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(76,29,149,.30),
            transparent 35%
        ),
        #090912;
}

.background::before,
.background::after {
    content: "";
    position: absolute;

    width: 55vw;
    height: 55vw;

    border-radius: 50%;

    filter: blur(80px);

    opacity: .22;

    animation: float 15s ease-in-out infinite alternate;
}

.background::before {
    background: var(--theme);
    left: -25vw;
    top: -25vw;
}

.background::after {
    background: var(--theme2);
    right: -25vw;
    bottom: -25vw;

    animation-delay: -6s;
}

@keyframes float {

    0% {
        transform: translate(0,0) scale(1);
    }

    100% {
        transform: translate(90px,60px) scale(1.18);
    }

}

/* =========================
APP
========================= */

.app {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
}

/* =========================
TOP BAR
========================= */

.topbar {
    height: 72px;

    margin: 14px 14px 0;

    padding: 0 18px;

    display: flex;
    align-items: center;

    background: rgba(10,10,20,.75);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border: 1px solid rgba(255,255,255,.09);

    border-radius: 20px;
}

.back {
    width: 43px;
    height: 43px;

    border: 0;
    border-radius: 13px;

    background: rgba(255,255,255,.07);

    color: white;

    font-size: 22px;

    cursor: pointer;

    transition: .2s ease;
}

.back:hover {
    background: rgba(255,255,255,.14);
    transform: scale(1.05);
}

.title {
    margin-left: 14px;
}

.title h1 {
    margin: 0;
    font-size: 21px;
}

.title p {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 11px;
}

/* =========================
CHAT
========================= */

.chat {
    flex: 1;

    min-height: 0;

    width: min(1000px, calc(100% - 28px));

    margin: 14px auto;

    display: flex;
    flex-direction: column;

    background: rgba(10,10,20,.62);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border: 1px solid rgba(255,255,255,.09);

    border-radius: 22px;

    overflow: hidden;
}

/* =========================
MESSAGES
========================= */

.messages {
    flex: 1;

    overflow-y: auto;

    padding: 22px;
}

.empty {
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    color: var(--muted);

    text-align: center;
}

.empty-icon {
    font-size: 48px;
    margin-bottom: 12px;
}

.empty h2 {
    margin: 0 0 5px;
    color: white;
    font-size: 20px;
}

.empty p {
    margin: 0;
    font-size: 13px;
}

/* =========================
MESSAGE
========================= */

.message {
    margin-bottom: 17px;

    animation: messageIn .2s ease;
}

@keyframes messageIn {

    from {
        opacity: 0;
        transform: translateY(5px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

.message-name {
    color: var(--theme2);

    font-size: 13px;

    font-weight: 700;

    margin-bottom: 4px;
}

.message-text {
    display: inline-block;

    max-width: 80%;

    padding: 10px 13px;

    border-radius: 13px;

    background: rgba(255,255,255,.07);

    font-size: 14px;

    word-wrap: break-word;
}

.message-time {
    display: inline-block;

    margin-left: 7px;

    color: rgba(255,255,255,.35);

    font-size: 10px;
}

/* =========================
INPUT
========================= */

.input-area {
    padding: 14px;

    display: flex;

    gap: 9px;

    border-top:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(0,0,0,.12);
}

.username {
    width: 120px;

    padding: 12px;

    border: 1px solid
        rgba(255,255,255,.1);

    border-radius: 12px;

    outline: none;

    background:
        rgba(255,255,255,.06);

    color: white;

    font-family: inherit;
}

.message-input {
    flex: 1;

    min-width: 0;

    padding: 12px 14px;

    border: 1px solid
        rgba(255,255,255,.1);

    border-radius: 12px;

    outline: none;

    background:
        rgba(255,255,255,.06);

    color: white;

    font-family: inherit;

    font-size: 14px;
}

.username:focus,
.message-input:focus {
    border-color:
        rgba(167,139,250,.55);
}

.send {
    padding: 0 19px;

    border: 0;

    border-radius: 12px;

    background: var(--theme);

    color: white;

    font-family: inherit;

    font-weight: 700;

    cursor: pointer;

    transition: .2s ease;
}

.send:hover {
    background: var(--theme2);
    transform: scale(1.03);
}

/* =========================
CLEAR BUTTON
========================= */

.clear {
    position: absolute;

    right: 25px;
    top: 32px;

    padding: 7px 10px;

    border: 1px solid
        rgba(255,255,255,.1);

    border-radius: 9px;

    background: rgba(255,255,255,.05);

    color: var(--muted);

    font-size: 10px;

    cursor: pointer;
}

.clear:hover {
    color: white;
    background: rgba(255,255,255,.1);
}

/* =========================
MOBILE
========================= */

@media(max-width:650px) {

    .topbar {
        margin: 9px 9px 0;
    }

    .chat {
        width: calc(100% - 18px);
        margin: 9px auto;
    }

    .username {
        width: 90px;
    }

    .send {
        padding: 0 14px;
    }

    .message-text {
        max-width: 90%;
    }

    .clear {
        display: none;
    }

}

</style>
</head>

<body>

<div class="background"></div>

<div class="app">

<!-- TOP BAR -->

<div class="topbar">

<button
class="back"
onclick="goHome()">
←
</button>

<div class="title">

<h1>💬 Nova Chat</h1>

<p>Messages are saved on this device</p>

</div>

<button
class="clear"
onclick="clearChat()">
Clear
</button>

</div>


<!-- CHAT -->

<div class="chat">

<div
class="messages"
id="messages">

</div>


<!-- INPUT -->

<div class="input-area">

<input
class="username"
id="username"
placeholder="Username"
maxlength="20">

<input
class="message-input"
id="messageInput"
placeholder="Type a message..."
maxlength="500">

<button
class="send"
onclick="sendMessage()">
Send
</button>

</div>

</div>

</div>


<script>

/* =========================
STORAGE KEY
========================= */

const CHAT_STORAGE =
"novaChatMessages";


/* =========================
HOME
========================= */

function goHome() {

    window.location.href =
        "./index.html";

}


/* =========================
LOAD CHAT
========================= */

function loadChat() {

    const saved =
        localStorage.getItem(
            CHAT_STORAGE
        );

    if (!saved) {

        showEmpty();

        return;

    }

    try {

        const messages =
            JSON.parse(saved);

        if (
            !Array.isArray(messages) ||
            messages.length === 0
        ) {

            showEmpty();

            return;

        }

        messages.forEach(
            addMessageToScreen
        );

    } catch {

        showEmpty();

    }

}


/* =========================
EMPTY CHAT
========================= */

function showEmpty() {

    const messages =
        document.getElementById(
            "messages"
        );

    messages.innerHTML = `
        <div class="empty" id="empty">
            <div class="empty-icon">💬</div>
            <h2>Welcome to Nova Chat</h2>
            <p>Send the first message.</p>
        </div>
    `;

}


/* =========================
SEND MESSAGE
========================= */

function sendMessage() {

    const username =
        document.getElementById(
            "username"
        ).value.trim();

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();

    if (!username) {

        alert("Enter a username.");

        return;

    }

    if (!text) {

        return;

    }

    const message = {

        username: username,

        text: text,

        time:
            new Date().toLocaleTimeString(
                [],
                {
                    hour: "numeric",
                    minute: "2-digit"
                }
            )

    };


    /* SAVE MESSAGE */

    let messages = [];

    try {

        messages =
            JSON.parse(
                localStorage.getItem(
                    CHAT_STORAGE
                )
            ) || [];

    } catch {

        messages = [];

    }


    messages.push(message);


    /*
    Prevent the chat from
    becoming enormous.
    */

    if (messages.length > 500) {

        messages =
            messages.slice(
                messages.length - 500
            );

    }


    localStorage.setItem(
        CHAT_STORAGE,
        JSON.stringify(messages)
    );


    /* DISPLAY */

    const empty =
        document.getElementById(
            "empty"
        );

    if (empty) {

        empty.remove();

    }

    addMessageToScreen(message);

    input.value = "";

    input.focus();

}


/* =========================
DISPLAY MESSAGE
========================= */

function addMessageToScreen(message) {

    const messages =
        document.getElementById(
            "messages"
        );


    const element =
        document.createElement(
            "div"
        );

    element.className =
        "message";


    const name =
        document.createElement(
            "div"
        );

    name.className =
        "message-name";

    name.textContent =
        message.username;


    const bubble =
        document.createElement(
            "span"
        );

    bubble.className =
        "message-text";

    bubble.textContent =
        message.text;


    const time =
        document.createElement(
            "span"
        );

    time.className =
        "message-time";

    time.textContent =
        message.time;


    element.appendChild(name);

    element.appendChild(bubble);

    element.appendChild(time);

    messages.appendChild(element);


    messages.scrollTop =
        messages.scrollHeight;

}


/* =========================
CLEAR CHAT
========================= */

function clearChat() {

    const confirmed =
        confirm(
            "Delete all saved Nova Chat messages?"
        );

    if (!confirmed) {

        return;

    }

    localStorage.removeItem(
        CHAT_STORAGE
    );

    showEmpty();

}


/* =========================
ENTER TO SEND
========================= */

document
.getElementById("messageInput")
.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================
SAVE USERNAME
========================= */

const savedUsername =
localStorage.getItem(
    "novaUsername"
);

if (savedUsername) {

    document.getElementById(
        "username"
    ).value =
        savedUsername;

}


document
.getElementById("username")
.addEventListener(
    "input",
    function() {

        localStorage.setItem(
            "novaUsername",
            this.value
        );

    }
);


/* =========================
START
========================= */

loadChat();

</script>

</body>
</html>
