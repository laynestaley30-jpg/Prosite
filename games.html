<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Games</title>

<style>

:root {
    --accent: #8b5cf6;
    --accent2: #a78bfa;
    --bg: #05050b;
    --text: #ffffff;
    --muted: rgba(255,255,255,.55);
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
}


/* =========================
   MOVING BACKGROUND
========================= */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -10;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(139,92,246,.25),
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(76,29,149,.20),
            transparent 35%
        ),
        #05050b;
}

.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
}

.orb1 {
    width: 500px;
    height: 500px;
    left: -150px;
    top: -150px;
    background: var(--accent);
    opacity: .28;
    animation: move1 18s ease-in-out infinite;
}

.orb2 {
    width: 450px;
    height: 450px;
    right: -150px;
    bottom: -150px;
    background: var(--accent2);
    opacity: .22;
    animation: move2 22s ease-in-out infinite;
}

.orb3 {
    width: 320px;
    height: 320px;
    left: 45%;
    top: 20%;
    background: #4c1d95;
    opacity: .18;
    animation: move3 16s ease-in-out infinite;
}

@keyframes move1 {
    0%,100% {
        transform: translate(0,0) scale(1);
    }

    50% {
        transform: translate(180px,120px) scale(1.25);
    }
}

@keyframes move2 {
    0%,100% {
        transform: translate(0,0) scale(1);
    }

    50% {
        transform: translate(-180px,-130px) scale(1.2);
    }
}

@keyframes move3 {
    0%,100% {
        transform: translate(0,0);
    }

    50% {
        transform: translate(150px,160px) scale(1.2);
    }
}


/* =========================
   APP
========================= */

.app {
    width: 100%;
    height: 100%;
    display: flex;
}


/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 82px;
    height: calc(100% - 28px);
    margin: 14px;
    padding: 12px 9px;

    display: flex;
    flex-direction: column;
    align-items: center;

    background: rgba(10,10,20,.42);

    border: 1px solid rgba(255,255,255,.10);
    border-radius: 25px;

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
}

.logo {
    width: 50px;
    height: 50px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 17px;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    font-size: 24px;
    margin-bottom: 14px;
}


/* =========================
   SIDEBAR CLOCK
========================= */

.side-clock {
    text-align: center;
    margin-bottom: 16px;
    font-family: "Courier New", monospace;
}

.side-time {
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
    color: var(--accent2);
}

.side-ampm {
    font-size: 8px;
    color: var(--muted);
    margin-top: 2px;
}


/* =========================
   SIDEBAR BUTTONS
========================= */

.sidebar-buttons {
    width: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 9px;
}

.sidebar-button {
    width: 50px;
    height: 50px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 0;
    border-radius: 16px;

    background: rgba(255,255,255,.055);

    color: white;
    text-decoration: none;

    font-size: 20px;

    cursor: pointer;

    transition: .2s ease;
}

.sidebar-button:hover {
    transform: scale(1.07);
    background: rgba(139,92,246,.25);
}

.sidebar-divider {
    width: 45px;
    height: 1px;

    margin: auto 0 10px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.25),
            transparent
        );
}


/* =========================
   MAIN
========================= */

.main {
    flex: 1;
    height: 100%;

    overflow-y: auto;

    padding: 40px;
}

.header {
    margin-bottom: 28px;
}

.header h1 {
    margin: 0;

    font-size: 42px;

    letter-spacing: -2px;
}

.header h1 span {
    color: var(--accent2);
}

.header p {
    margin: 8px 0 0;
    color: var(--muted);
}


/* =========================
   SEARCH
========================= */

.search {
    width: 100%;
    max-width: 600px;

    padding: 14px 17px;

    margin-bottom: 28px;

    border: 1px solid rgba(255,255,255,.10);
    border-radius: 15px;

    outline: none;

    background: rgba(255,255,255,.06);

    color: white;

    font-size: 14px;
}

.search::placeholder {
    color: var(--muted);
}

.search:focus {
    border-color: rgba(167,139,250,.45);
}


/* =========================
   GAME GRID
========================= */

.games {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(190px, 1fr)
        );

    gap: 18px;
}


/* =========================
   GAME CARD
========================= */

.game-card {
    min-height: 165px;

    padding: 20px;

    border-radius: 20px;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid
        rgba(255,255,255,.08);

    cursor: pointer;

    transition: .25s ease;
}

.game-card:hover {
    transform: translateY(-6px);

    background:
        rgba(255,255,255,.095);

    border-color:
        rgba(167,139,250,.35);

    box-shadow:
        0 15px 40px rgba(0,0,0,.25);
}

.game-icon {
    width: 55px;
    height: 55px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 15px;

    border-radius: 17px;

    background:
        rgba(139,92,246,.18);

    font-size: 28px;
}

.game-card h3 {
    margin: 0 0 7px;
    font-size: 16px;
}

.game-card p {
    margin: 0;
    color: var(--muted);
    font-size: 12px;
}


/* =========================
   GAME OVERLAY
========================= */

.game-overlay {
    display: none;

    position: fixed;
    inset: 0;

    z-index: 9999;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.82);

    backdrop-filter: blur(12px);
}


/* =========================
   GAME WINDOW
========================= */

.game-window {
    width: 94vw;
    height: 90vh;

    max-width: 1500px;

    background: #080810;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius: 20px;

    overflow: hidden;

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.70);

    display: flex;
    flex-direction: column;
}


/* =========================
   GAME HEADER
========================= */

.game-header {
    height: 55px;
    min-height: 55px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 15px;

    background:
        rgba(20,20,30,.96);

    border-bottom:
        1px solid
        rgba(255,255,255,.08);
}

.game-title {
    font-size: 14px;
    font-weight: bold;
}

.close-game {
    width: 36px;
    height: 36px;

    border: 0;
    border-radius: 10px;

    background:
        rgba(255,255,255,.08);

    color: white;

    cursor: pointer;

    font-size: 16px;
}

.close-game:hover {
    background:
        rgba(239,68,68,.35);
}


/* =========================
   GAME IFRAME
========================= */

#gameFrame {
    width: 100%;
    height: 100%;

    flex: 1;

    display: block;

    border: 0;

    background: white;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    .sidebar {
        width: 65px;
        margin: 9px;
        height: calc(100% - 18px);
    }

    .sidebar-button {
        width: 43px;
        height: 43px;
        font-size: 18px;
    }

    .main {
        padding: 25px 18px;
    }

    .header h1 {
        font-size: 32px;
    }

    .games {
        grid-template-columns: 1fr;
    }

    .game-window {
        width: 97vw;
        height: 92vh;
    }
}

</style>
</head>


<body>


<div class="background">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
</div>


<div class="app">


<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">
        ✦
    </div>

    <div class="side-clock">

        <div
            class="side-time"
            id="sideTime">
            00:00
        </div>

        <div
            class="side-ampm"
            id="sideAmpm">
            AM
        </div>

    </div>


    <div class="sidebar-buttons">

        <a
            href="index.html"
            class="sidebar-button">
            🏠
        </a>

        <a
            href="games.html"
            class="sidebar-button">
            🎮
        </a>

        <a
            href="music.html"
            class="sidebar-button">
            🎵
        </a>

        <a
            href="chat.html"
            class="sidebar-button">
            💬
        </a>

        <a
            href="Nova.html"
            class="sidebar-button">
            🤖
        </a>

        <a
            href="https://www.google.com"
            target="_blank"
            rel="noopener"
            class="sidebar-button">
            G
        </a>

    </div>


    <div class="sidebar-divider"></div>


    <a
        href="settings.html"
        class="sidebar-button">
        ⚙️
    </a>

</aside>


<!-- MAIN -->

<main class="main">

    <div class="header">

        <h1>
            Nova <span>Games</span>
        </h1>

        <p>
            Choose a game and start playing.
        </p>

    </div>


    <input
        class="search"
        id="gameSearch"
        type="text"
        placeholder="Search games...">


    <div
        class="games"
        id="games">


        <!-- CSGO CASE CLICKER -->

        <div
    class="game-card"
    data-name="CSGO Case Clicker"
    onclick="window.location.href='csgo.html'">

    <div class="game-icon">
        📦
    </div>

    <h3>CSGO Case Clicker</h3>

    <p>Open cases</p>

</div>


        <!-- COOKIE CLICKER PLACEHOLDER -->

        <div
            class="game-card"
            data-name="Cookie Clicker">

            <div class="game-icon">
                🍪
            </div>

            <h3>
                Cookie Clicker
            </h3>

            <p>
                Coming soon
            </p>

        </div>


    </div>

</main>

</div>


<!-- =========================
     GAME POPUP
========================= -->

<div
    class="game-overlay"
    id="gameOverlay">


    <div class="game-window">


        <div class="game-header">

            <span
                class="game-title">
                CSGO Case Clicker
            </span>


            <button
                class="close-game"
                onclick="closeGame()">

                ✕

            </button>

        </div>


        <iframe
            id="gameFrame"
            src=""
            title="CSGO Case Clicker"
            allow="fullscreen; autoplay; gamepad"
            allowfullscreen
            scrolling="no">
        </iframe>


    </div>

</div>


<script>

/* =========================
   CLOCK
========================= */

function updateClock() {

    const now = new Date();

    let hours = now.getHours();

    const minutes =
        String(
            now.getMinutes()
        ).padStart(2, "0");

    const ampm =
        hours >= 12
            ? "PM"
            : "AM";

    hours =
        hours % 12 || 12;

    hours =
        String(hours)
        .padStart(2, "0");

    document.getElementById(
        "sideTime"
    ).textContent =
        `${hours}:${minutes}`;

    document.getElementById(
        "sideAmpm"
    ).textContent =
        ampm;
}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =========================
   OPEN CSGO
========================= */

function openGame() {

    const frame =
        document.getElementById(
            "gameFrame"
        );

    frame.src =
        "https://kingofkfcjamal.github.io/CaseClicker/";

    document.getElementById(
        "gameOverlay"
    ).style.display =
        "flex";
}


/* =========================
   CLOSE GAME
========================= */

function closeGame() {

    document.getElementById(
        "gameFrame"
    ).src = "";

    document.getElementById(
        "gameOverlay"
    ).style.display =
        "none";
}


/* =========================
   ESCAPE KEY
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {
            closeGame();
        }

    }
);


/* =========================
   SEARCH
========================= */

document.getElementById(
    "gameSearch"
).addEventListener(
    "input",
    function() {

        const search =
            this.value
            .toLowerCase();

        const cards =
            document.querySelectorAll(
                ".game-card"
            );

        cards.forEach(
            card => {

                const name =
                    card.dataset.name
                    .toLowerCase();

                card.style.display =
                    name.includes(search)
                        ? ""
                        : "none";

            }
        );

    }
);


/* =========================
   ACCENT COLOR
========================= */

const savedAccent =
    localStorage.getItem(
        "novaAccent"
    );

const colors = {

    purple: [
        "#8b5cf6",
        "#a78bfa"
    ],

    blue: [
        "#3b82f6",
        "#60a5fa"
    ],

    cyan: [
        "#06b6d4",
        "#67e8f9"
    ],

    pink: [
        "#ec4899",
        "#f472b6"
    ],

    green: [
        "#10b981",
        "#34d399"
    ],

    orange: [
        "#f97316",
        "#fb923c"
    ],

    red: [
        "#ef4444",
        "#f87171"
    ]

};

if (
    savedAccent &&
    colors[savedAccent]
) {

    document.documentElement
        .style
        .setProperty(
            "--accent",
            colors[savedAccent][0]
        );

    document.documentElement
        .style
        .setProperty(
            "--accent2",
            colors[savedAccent][1]
        );
}

</script>

</body>
</html>
