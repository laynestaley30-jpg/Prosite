<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nova — AI</title>
  <style>
    :root{--bg:#07070d;--panel:rgba(18,18,30,.72);--accent:#8b5cf6;--muted:rgba(255,255,255,.62)}
    html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#fff}
    .app{max-width:900px;margin:36px auto;padding:20px;background:linear-gradient(145deg,rgba(255,255,255,.03),rgba(255,255,255,.01));border-radius:12px;border:1px solid rgba(255,255,255,.06)}
    h1{margin:0 0 12px;font-size:26px}
    .messages{height:60vh;overflow:auto;padding:12px;border-radius:8px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.03)}
    .msg{margin:8px 0;padding:10px;border-radius:10px;max-width:78%}
    .user{background:linear-gradient(90deg,var(--accent),#a78bfa);color:#000;margin-left:auto}
    .assistant{background:rgba(255,255,255,.04);color:#fff}
    .assistant a{color:#8b5cf6;text-decoration:underline;cursor:pointer}
    .assistant a:hover{color:#a78bfa;text-decoration:underline}
    form{display:flex;gap:8px;margin-top:12px}
    input[type=text]{flex:1;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.06);background:transparent;color:#fff}
    button{padding:10px 14px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer}
    .meta{font-size:13px;color:var(--muted);margin-bottom:8px}
  </style>
</head>
<body>
  <div class="app">
    <h1>Nova — AI Assistant</h1>
    <div class="meta">Powered by a server-side model. Keep your API key secret when you deploy.</div>
    <div id="messages" class="messages" role="log" aria-live="polite"></div>

    <form id="chatForm">
      <input id="prompt" type="text" autocomplete="off" placeholder="Ask Nova something..." required />
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('chatForm');
    const input = document.getElementById('prompt');

    function parseLinksInText(text) {
      // Match URLs in text and convert them to clickable links
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      const parts = [];
      let lastIndex = 0;
      
      text.replace(urlRegex, (match, url, offset) => {
        // Add text before the URL
        if (offset > lastIndex) {
          parts.push({ type: 'text', content: text.substring(lastIndex, offset) });
        }
        // Add the URL as a link
        parts.push({ type: 'link', content: url, href: url });
        lastIndex = offset + match.length;
      });
      
      // Add remaining text
      if (lastIndex < text.length) {
        parts.push({ type: 'text', content: text.substring(lastIndex) });
      }
      
      return parts;
    }

    function appendMessage(text, cls) {
      const d = document.createElement('div');
      d.className = 'msg ' + cls;
      
      if (cls === 'assistant') {
        // Parse links in assistant messages
        const parts = parseLinksInText(text);
        parts.forEach(part => {
          if (part.type === 'link') {
            const link = document.createElement('a');
            link.href = part.href;
            link.textContent = part.content;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            d.appendChild(link);
          } else {
            d.appendChild(document.createTextNode(part.content));
          }
        });
      } else {
        d.textContent = text;
      }
      
      messagesEl.appendChild(d);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      appendMessage(text, 'user');
      input.value = '';
      appendMessage('Nova is thinking...', 'assistant');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({message: text})
        });

        // remove the "thinking" placeholder
        const placeholders = [...messagesEl.querySelectorAll('.assistant')];
        const lastPlaceholder = placeholders[placeholders.length-1];
        if (lastPlaceholder && lastPlaceholder.textContent === 'Nova is thinking...') {
          lastPlaceholder.remove();
        }

        if (!res.ok) {
          const err = await res.json().catch(()=>({error:res.statusText}));
          appendMessage('Error: ' + (err.error || res.statusText), 'assistant');
          return;
        }

        const data = await res.json();
        appendMessage(data.reply || 'No reply', 'assistant');
      } catch (err) {
        appendMessage('Network error: ' + (err.message||err), 'assistant');
      }
    });
  </script>
</body>
</html>
