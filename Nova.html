<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova</title>

<style>
:root {
    --accent: #8b5cf6;
    --accent2: #a78bfa;
    --bg: #05050b;
    --text: #ffffff;
    --muted: rgba(255,255,255,.55);
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    color: var(--text);

    font-family:
        "Trebuchet MS",
        Arial,
        sans-serif;

    background: var(--bg);
}

/* =========================
   MOVING BACKGROUND
========================= */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -10;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(139,92,246,.08),
            transparent 55%
        ),
        #05050b;
}

.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .30;
    pointer-events: none;
}

.orb1 {
    width: 550px;
    height: 550px;
    left: -180px;
    top: -180px;
    background: var(--accent);

    animation:
        moveOne 18s ease-in-out infinite;
}

.orb2 {
    width: 500px;
    height: 500px;
    right: -180px;
    bottom: -180px;
    background: var(--accent2);

    animation:
        moveTwo 22s ease-in-out infinite;
}

.orb3 {
    width: 350px;
    height: 350px;
    left: 45%;
    top: 15%;
    background: #4c1d95;
    opacity: .18;

    animation:
        moveThree 16s ease-in-out infinite;
}

.orb4 {
    width: 280px;
    height: 280px;
    left: 20%;
    bottom: -100px;
    background: var(--accent);
    opacity: .16;

    animation:
        moveFour 20s ease-in-out infinite;
}

.orb5 {
    width: 260px;
    height: 260px;
    right: 20%;
    top: -100px;
    background: var(--accent2);
    opacity: .12;

    animation:
        moveFive 25s ease-in-out infinite;
}

@keyframes moveOne {
    0%,100% {
        transform: translate(0,0) scale(1);
    }

    50% {
        transform: translate(180px,120px) scale(1.25);
    }
}

@keyframes moveTwo {
    0%,100% {
        transform: translate(0,0) scale(1);
    }

    50% {
        transform: translate(-180px,-130px) scale(1.2);
    }
}

@keyframes moveThree {
    0%,100% {
        transform: translate(0,0);
    }

    50% {
        transform: translate(150px,180px) scale(1.25);
    }
}

@keyframes moveFour {
    0%,100% {
        transform: translate(0,0);
    }

    50% {
        transform: translate(220px,-180px) scale(1.3);
    }
}

@keyframes moveFive {
    0%,100% {
        transform: translate(0,0);
    }

    50% {
        transform: translate(-200px,180px) scale(1.2);
    }
}

/* =========================
   PARTICLES
========================= */

.particles {
    position: absolute;
    inset: 0;
}

.particle {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: var(--accent2);

    opacity: .35;

    animation:
        particleMove linear infinite;
}

@keyframes particleMove {
    from {
        transform: translateY(110vh);
    }

    to {
        transform: translateY(-20vh);
    }
}

/* =========================
   APP
========================= */

.app {
    width: 100%;
    height: 100%;
    display: flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 82px;

    height:
        calc(100% - 28px);

    margin: 14px;

    padding: 12px 9px;

    display: flex;
    flex-direction: column;
    align-items: center;

    background:
        rgba(10,10,20,.42);

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius: 25px;

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.35);
}

/* =========================
   LOGO
========================= */

.logo {
    width: 50px;
    height: 50px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 17px;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    box-shadow:
        0 0 28px
        rgba(139,92,246,.35);

    font-size: 24px;

    margin-bottom: 12px;
}

/* =========================
   SIDEBAR CLOCK
========================= */

.side-clock {
    text-align: center;
    margin-bottom: 16px;

    font-family:
        "Courier New",
        monospace;
}

.side-time {
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
    color: var(--accent2);
}

.side-ampm {
    font-size: 8px;
    color: var(--muted);
    margin-top: 2px;
}

/* =========================
   SIDEBAR BUTTONS
========================= */

.sidebar-buttons {
    width: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 9px;
}

.sidebar-button {
    position: relative;

    width: 50px;
    height: 50px;

    border: 0;
    border-radius: 16px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        rgba(255,255,255,.055);

    color: white;

    cursor: pointer;

    transition: .22s ease;

    font-size: 20px;
}

.sidebar-button:hover {
    transform:
        translateY(-2px)
        scale(1.06);

    background:
        rgba(139,92,246,.25);
}

.sidebar-button.active {
    background:
        rgba(139,92,246,.35);

    box-shadow:
        0 0 18px
        rgba(139,92,246,.20);
}

/* =========================
   TOOLTIP
========================= */

.sidebar-button::after {
    content: attr(data-label);

    position: absolute;

    left: 64px;
    top: 50%;

    transform:
        translateY(-50%)
        translateX(-5px);

    padding: 7px 10px;

    border-radius: 8px;

    background:
        rgba(4,4,9,.95);

    color: white;

    font-size: 11px;

    white-space: nowrap;

    opacity: 0;

    pointer-events: none;

    transition: .18s ease;

    z-index: 100;
}

.sidebar-button:hover::after {
    opacity: 1;

    transform:
        translateY(-50%)
        translateX(0);
}

/* =========================
   DIVIDER
========================= */

.sidebar-divider {
    width: 45px;
    height: 1px;

    margin:
        auto 0 10px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.25),
            transparent
        );
}

/* =========================
   MAIN
========================= */

.main {
    flex: 1;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 30px;
}

/* =========================
   CENTER
========================= */

.center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* =========================
   WELCOME
========================= */

.welcome-small {
    color: var(--muted);

    font-size: 14px;

    letter-spacing: 4px;

    text-transform: uppercase;

    margin-bottom: 10px;
}

.welcome {
    margin: 0;

    font-size:
        clamp(52px,9vw,105px);

    font-weight: 700;

    letter-spacing: -5px;

    line-height: .95;
}

#welcomeWord {
    display: inline-block;

    color: var(--accent2);

    text-shadow:
        0 0 35px
        rgba(139,92,246,.40);

    transition:
        opacity .5s ease,
        transform .5s ease;
}

#welcomeWord.fade-out {
    opacity: 0;
    transform: translateY(8px);
}

#welcomeWord.fade-in {
    opacity: 1;
    transform: translateY(0);
}

/* =========================
   DIGITAL CLOCK
========================= */

.big-clock {
    margin-top: 30px;

    font-family:
        "Courier New",
        monospace;

    font-size:
        clamp(38px,6vw,68px);

    font-weight: bold;

    letter-spacing: 6px;

    color: white;

    text-shadow:
        0 0 20px
        rgba(139,92,246,.45);
}

.big-date {
    margin-top: 8px;

    color: var(--muted);

    font-size: 13px;

    letter-spacing: 2px;
}

/* =========================
   LINE
========================= */

.center-line {
    width:
        min(330px,70vw);

    height: 1px;

    margin-top: 30px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--accent),
            transparent
        );

    opacity: .5;
}

/* =========================
   NO ANIMATION
========================= */

.no-animation .orb,
.no-animation .particle {
    animation: none !important;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    .sidebar {
        width: 65px;
        margin: 9px;

        height:
            calc(100% - 18px);
    }

    .logo {
        width: 43px;
        height: 43px;
        font-size: 20px;
    }

    .sidebar-button {
        width: 43px;
        height: 43px;
        font-size: 18px;
    }

    .sidebar-button::after {
        display: none;
    }

    .side-clock {
        margin-bottom: 12px;
    }

    .side-time {
        font-size: 9px;
    }

    .welcome-small {
        font-size: 10px;
        letter-spacing: 3px;
    }

    .welcome {
        font-size: 53px;
        letter-spacing: -3px;
    }

    .big-clock {
        font-size: 30px;
        letter-spacing: 3px;
    }

    .big-date {
        font-size: 10px;
    }
}

</style>
</head>

<body>

<!-- =========================
     BACKGROUND
========================= -->

<div class="background">

    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
    <div class="orb orb4"></div>
    <div class="orb orb5"></div>

    <div
        class="particles"
        id="particles">
    </div>

</div>

<!-- =========================
     APP
========================= -->

<div class="app">

<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar">

    <div class="logo">
        ✦
    </div>

    <div class="side-clock">

        <div
            class="side-time"
            id="sideTime">
            00:00
        </div>

        <div
            class="side-ampm"
            id="sideAmpm">
            AM
        </div>

    </div>

    <div class="sidebar-buttons">

        <button
            class="sidebar-button active"
            data-label="Home"
            onclick="location.href='index.html'">
            🏠
        </button>

        <button
            class="sidebar-button"
            data-label="Games"
            onclick="location.href='games.html'">
            🎮
        </button>

        <button
            class="sidebar-button"
            data-label="Music"
            onclick="location.href='music.html'">
            🎵
        </button>

        <button
            class="sidebar-button"
            data-label="Chat"
            onclick="location.href='chat.html'">
            💬
        </button>

        <button
            class="sidebar-button"
            data-label="Nova AI"
            onclick="location.href='Nova.html'">
            🤖
        </button>

        <button
            class="sidebar-button"
            data-label="Google"
            onclick="window.open('https://www.google.com','_blank')">
            G
        </button>

    </div>

    <div class="sidebar-divider"></div>

    <button
        class="sidebar-button"
        data-label="Settings"
        onclick="location.href='settings.html'">
        ⚙️
    </button>

</aside>

<!-- =========================
     MAIN
========================= -->

<main class="main">

    <div class="center">

        <div class="welcome-small">
            Welcome to
        </div>

        <h1 class="welcome">
            <span id="welcomeWord">
                Nova
            </span>
        </h1>

        <div
            class="big-clock"
            id="bigClock">
            00:00:00
        </div>

        <div
            class="big-date"
            id="bigDate">
            Loading...
        </div>

        <div class="center-line"></div>

    </div>

</main>

</div>

<script>

/* =========================
   CLOCK
========================= */

function updateClock() {

    const now = new Date();

    let hours = now.getHours();

    const minutes =
        String(
            now.getMinutes()
        ).padStart(2,"0");

    const seconds =
        String(
            now.getSeconds()
        ).padStart(2,"0");

    const ampm =
        hours >= 12
            ? "PM"
            : "AM";

    hours =
        hours % 12 || 12;

    hours =
        String(hours)
        .padStart(2,"0");

    document.getElementById(
        "bigClock"
    ).textContent =
        `${hours}:${minutes}:${seconds}`;

    document.getElementById(
        "sideTime"
    ).textContent =
        `${hours}:${minutes}`;

    document.getElementById(
        "sideAmpm"
    ).textContent =
        ampm;

    document.getElementById(
        "bigDate"
    ).textContent =
        now.toLocaleDateString(
            [],
            {
                weekday:"long",
                month:"long",
                day:"numeric",
                year:"numeric"
            }
        );
}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =========================
   WELCOME WORDS
========================= */

const welcomeWords = [

    "Nova",
    "Home",
    "Happiness",
    "Freedom",
    "Peace",
    "Adventure",
    "Possibility",
    "Creativity",
    "Dreams",
    "Discovery",
    "Joy",
    "Wonder"

];

let welcomeIndex = 0;

const welcomeWord =
    document.getElementById(
        "welcomeWord"
    );


function changeWelcomeWord() {

    welcomeWord.classList.add(
        "fade-out"
    );

    setTimeout(() => {

        welcomeIndex =
            (welcomeIndex + 1)
            % welcomeWords.length;

        welcomeWord.textContent =
            welcomeWords[
                welcomeIndex
            ];

        welcomeWord.classList.remove(
            "fade-out"
        );

        welcomeWord.classList.add(
            "fade-in"
        );

        setTimeout(() => {

            welcomeWord.classList.remove(
                "fade-in"
            );

        },500);

    },500);
}


setInterval(
    changeWelcomeWord,
    3500
);


/* =========================
   PARTICLES
========================= */

function createParticles() {

    const container =
        document.getElementById(
            "particles"
        );

    for (
        let i = 0;
        i < 45;
        i++
    ) {

        const particle =
            document.createElement(
                "div"
            );

        particle.className =
            "particle";

        particle.style.left =
            Math.random() * 100 + "%";

        particle.style.animationDuration =
            (
                8 +
                Math.random() * 18
            ) + "s";

        particle.style.animationDelay =
            (
                -Math.random() * 20
            ) + "s";

        particle.style.opacity =
            .1 +
            Math.random() * .4;

        container.appendChild(
            particle
        );
    }
}


/* =========================
   SETTINGS
========================= */

function loadSettings() {

    const accent =
        localStorage.getItem(
            "novaAccent"
        );

    const animation =
        localStorage.getItem(
            "novaAnimations"
        );

    if (accent) {
        applyAccent(accent);
    }

    if (
        animation === "off"
    ) {

        document.body.classList.add(
            "no-animation"
        );
    }
}


function applyAccent(color) {

    const colors = {

        purple: [
            "#8b5cf6",
            "#a78bfa"
        ],

        blue: [
            "#3b82f6",
            "#60a5fa"
        ],

        cyan: [
            "#06b6d4",
            "#67e8f9"
        ],

        pink: [
            "#ec4899",
            "#f472b6"
        ],

        green: [
            "#10b981",
            "#34d399"
        ],

        orange: [
            "#f97316",
            "#fb923c"
        ],

        red: [
            "#ef4444",
            "#f87171"
        ]

    };

    const selected =
        colors[color] ||
        colors.purple;

    document.documentElement.style
        .setProperty(
            "--accent",
            selected[0]
        );

    document.documentElement.style
        .setProperty(
            "--accent2",
            selected[1]
        );
}


/* =========================
   START
========================= */

createParticles();

loadSettings();

</script>

</body>
</html>
